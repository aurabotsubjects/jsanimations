<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Translation – Paper Cut-out Animation</title>
<style>
  html,body{margin:0;height:100%;background:#8a6a3f;display:flex;align-items:center;justify-content:center;font-family:"Patrick Hand","Chalkboard SE","Comic Sans MS",cursive}
  #wrap{position:relative;width:min(100vw,calc(100vh*960/540));aspect-ratio:960/540}
  canvas{width:100%;height:100%;display:block}
  #rp{display:none;position:absolute;left:73.5%;top:82%;width:24%;padding:.5em;font:inherit;font-size:clamp(14px,2.6vw,28px);font-weight:bold;
    background:#ffd23f;color:#3b2a14;border:4px solid #fff;border-radius:10px 14px 9px 13px;cursor:pointer;
    box-shadow:3px 5px 8px rgba(0,0,0,.4);transform:rotate(-2deg)}
  #rp:hover{transform:rotate(1deg) scale(1.05)}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="1920" height="1080"></canvas><button id="rp">&#8635; Replay</button></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),rp=document.getElementById('rp');ctx.scale(cv.width/960,cv.height/540);
const S=50,GX=50,GY=40,FONT='"Patrick Hand","Chalkboard SE","Comic Sans MS",cursive';
const gx=x=>GX+x*S, gy=y=>GY+(9-y)*S;
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
let run=0, items=[], CAP={t:'',b:'',pop:1};

// ---------- seeded wobble for hand-cut edges ----------
const wob=(i,j)=>{const s=Math.sin(i*127.1+j*311.7)*43758.5453;return (s-Math.floor(s))-.5};

// ---------- background (kraft paper + graph paper sheet) ----------
const bg=document.createElement('canvas');bg.width=960;bg.height=540;
(function(){const b=bg.getContext('2d');b.fillStyle='#c9a66b';b.fillRect(0,0,960,540);
 for(let i=0;i<900;i++){b.fillStyle=`rgba(${wob(i,1)>0?'255,240,200':'90,60,20'},.08)`;b.fillRect((wob(i,2)+.5)*960,(wob(i,3)+.5)*540,2,2)}})();

function drawBase(){
  ctx.drawImage(bg,0,0,960,540);
  // graph sheet
  ctx.save();ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=10;ctx.shadowOffsetX=4;ctx.shadowOffsetY=6;
  ctx.fillStyle='#fffaf0';ctx.beginPath();ctx.rect(GX-32,GY-18,12*S+52,9*S+52);ctx.fill();ctx.restore();
  ctx.lineWidth=1;ctx.strokeStyle='#a9d3ea';
  for(let x=0;x<=12;x++){ctx.beginPath();ctx.moveTo(gx(x),gy(0));ctx.lineTo(gx(x),gy(9));ctx.stroke()}
  for(let y=0;y<=9;y++){ctx.beginPath();ctx.moveTo(gx(0),gy(y));ctx.lineTo(gx(12),gy(y));ctx.stroke()}
  ctx.strokeStyle='#3b2a14';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(gx(0),gy(9));ctx.lineTo(gx(0),gy(0));ctx.lineTo(gx(12),gy(0));ctx.stroke();
  ctx.fillStyle='#3b2a14';ctx.font=`16px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';
  for(let x=0;x<=12;x++)ctx.fillText(x,gx(x),gy(0)+16);
  for(let y=1;y<=9;y++)ctx.fillText(y,gx(0)-15,gy(y));
  ctx.font=`bold 18px ${FONT}`;ctx.fillText('x',gx(12)+16,gy(0));ctx.fillText('y',gx(0),gy(9)-12);
}

// ---------- caption paper ----------
function wrap(s,w,fs){ctx.font=`${fs}px ${FONT}`;const out=[];let line='';
  for(const word of s.split(' ')){const t=line?line+' '+word:word;if(ctx.measureText(t).width>w&&line){out.push(line);line=word}else line=t}
  out.push(line);return out}
function drawCaption(){
  const sc=.92+.08*ease(CAP.pop);
  ctx.save();ctx.translate(820,265);ctx.rotate(-.025);ctx.scale(sc,sc);
  ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=10;ctx.shadowOffsetX=4;ctx.shadowOffsetY=6;
  ctx.fillStyle='#ffd6e0';ctx.fillRect(-120,-225,240,450);ctx.shadowColor='transparent';
  ctx.fillStyle='rgba(255,230,120,.8)';ctx.save();ctx.rotate(.05);ctx.fillRect(-45,-240,90,24);ctx.restore();
  ctx.fillStyle='#b5179e';ctx.textAlign='center';ctx.textBaseline='top';ctx.font=`bold 27px ${FONT}`;
  let y=-195;for(const l of wrap(CAP.t,210,27)){ctx.fillText(l,0,y);y+=30}
  y+=10;ctx.fillStyle='#3b2a14';ctx.font=`21px ${FONT}`;
  for(const l of wrap(CAP.b,205,21)){ctx.fillText(l,0,y);y+=26}
  ctx.restore();
}
function cap(t,b){CAP.t=t;CAP.b=b;CAP.pop=0;anim(450,k=>CAP.pop=k)}

// ---------- items ----------
function cutPath(pts,ox,oy){ // hand-cut polygon
  ctx.beginPath();const n=pts.length;
  for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n];
    const ax=gx(a[0]+ox),ay=gy(a[1]+oy),bx=gx(b[0]+ox),by=gy(b[1]+oy);
    if(i==0)ctx.moveTo(ax,ay);
    ctx.lineTo((ax+bx)/2+wob(i,5)*3,(ay+by)/2+wob(i,6)*3);ctx.lineTo(bx,by)}
  ctx.closePath()}
function drawItem(o){
  ctx.save();ctx.globalAlpha=o.a??1;
  if(o.t==='tri'){
    const dy=o.dy||0;ctx.translate(0,dy);cutPath(o.p,o.ox||0,o.oy||0);
    if(o.ghost){ctx.setLineDash([7,6]);ctx.lineWidth=3;ctx.strokeStyle=o.c;ctx.stroke();ctx.globalAlpha*=.3;ctx.fillStyle=o.c;ctx.fill()}
    else{ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=7;ctx.shadowOffsetX=3;ctx.shadowOffsetY=5;
      ctx.lineJoin='round';ctx.lineWidth=9;ctx.strokeStyle='#fff';ctx.stroke();ctx.fillStyle=o.c;ctx.fill()}
  }else if(o.t==='line'){
    const x2=o.x1+(o.x2-o.x1)*o.p,y2=o.y1+(o.y2-o.y1)*o.p;
    ctx.strokeStyle=o.c;ctx.lineWidth=o.w||5;ctx.lineCap='round';if(o.dash)ctx.setLineDash([10,9]);
    ctx.beginPath();ctx.moveTo(gx(o.x1),gy(o.y1));ctx.lineTo(gx(x2),gy(y2));ctx.stroke();
  }else if(o.t==='dot'){
    const px=gx(o.x),py=gy(o.y)+(o.dy||0),r=11*(o.s??1);
    ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=4;ctx.shadowOffsetX=2;ctx.shadowOffsetY=3;
    ctx.fillStyle=o.c;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(px,py,r,0,7);ctx.fill();ctx.stroke();
    if(o.l){ctx.shadowColor='transparent';ctx.fillStyle='#3b2a14';ctx.font=`bold 22px ${FONT}`;ctx.textAlign='left';ctx.textBaseline='alphabetic';
      ctx.fillText(o.l,px+14,py-10)}
  }else if(o.t==='txt'){
    ctx.font=`bold ${o.size||19}px ${FONT}`;const w=ctx.measureText(o.s).width+16;
    ctx.translate(gx(o.x),gy(o.y));ctx.rotate(o.r||-.04);
    ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=4;ctx.shadowOffsetX=2;ctx.shadowOffsetY=3;
    ctx.fillStyle=o.bg||'#fff7c2';ctx.fillRect(-w/2,-15,w,30);ctx.shadowColor='transparent';
    ctx.fillStyle=o.c||'#3b2a14';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.s,0,1);
  }
  ctx.restore();
}
function frame(){drawBase();items.forEach(drawItem);drawCaption();requestAnimationFrame(frame)}
frame();

// ---------- timing helpers (cancel-safe) ----------
function anim(ms,f){return new Promise(res=>{const id=run,t0=performance.now();
  function s(n){if(id!==run)return;const k=Math.min(1,Math.max(0,(n-t0)/ms));f(k);if(k<1)requestAnimationFrame(s);else res()}
  requestAnimationFrame(s)})}
const wait=ms=>anim(ms,()=>{});
const add=o=>(items.push(o),o);
const rm=o=>{items=items.filter(i=>i!==o)};
async function pop(o,ms=350){o.a=0;o.s=0;add(o);await anim(ms,k=>{o.a=Math.min(1,k*2);o.s=ease(k)});return o}
async function line(x1,y1,x2,y2,c,ms=800,dash=true,w){const l=add({t:'line',x1,y1,x2,y2,p:0,c,dash,w});await anim(ms,k=>l.p=ease(k));return l}
const tag=(x,y,s,o={})=>pop({t:'txt',x,y,s,...o},250);

// ---------- the story ----------
const A=[1,1],B=[4,1],C=[1,4],ORANGE='#f4a259',BLUE='#4aa8e8',RED='#e63e6d',TEAL='#1f9d8f',PURP='#7b5ea7';
const names=['A','B','C'],cols=[RED,TEAL,PURP];
function makeOrig(){const o={t:'tri',p:[A,B,C],c:ORANGE,dy:-500};add(o);return o}
async function newTriangle(P,color){ // join dots then glue the cut-out down
  const L=[];for(let i=0;i<3;i++){const a=P[i],b=P[(i+1)%3];L.push(await line(a[0],a[1],b[0],b[1],'#333',500,false,4))}
  const t={t:'tri',p:P,c:color,a:0};items.splice(1,0,t);await anim(600,k=>t.a=k);L.forEach(rm);
}

async function story(){
  const id=++run;rp.style.display='none';items=[];
  const orig=makeOrig();
  cap('Translation','A translation SLIDES a shape. It does not turn. It does not flip. It stays the same size.');
  await anim(900,k=>orig.dy=-500*(1-ease(k)));await wait(1800);
  const g={t:'tri',p:[A,B,C],c:BLUE,ghost:true,ox:0,oy:0,a:.9};add(g);
  await anim(1800,k=>{g.ox=6*ease(k);g.oy=3*ease(k)});await wait(1200);rm(g);

  // --- Part 1: describing a translation
  cap('Describing a translation','To say how far a shape moved, follow ONE point. Watch point A hop across. Go along (x) first, then up or down (y).');
  const a=await pop({t:'dot',x:1,y:1,c:RED,l:'A'});await wait(1200);
  const hop=add({t:'dot',x:1,y:1,c:'#ffd23f'});const tg=[];
  for(let i=1;i<=6;i++){await anim(420,k=>{hop.x=i+ease(k);hop.dy=-Math.sin(Math.PI*k)*26});tg.push(await tag(1+i,.5,''+i,{size:17}))}
  cap('Describing a translation','A moved 6 squares to the RIGHT. Now count UP.');
  for(let i=1;i<=3;i++){await anim(420,k=>{hop.y=i+ease(k);hop.dy=-Math.sin(Math.PI*k)*26});tg.push(await tag(7.6,1+i,''+i,{size:17}))}
  await pop({t:'dot',x:7,y:4,c:RED,l:"A'"});
  await tag(4,5.8,'6 right, 3 up',{size:26,bg:'#ffe27a',r:-.05});
  cap('Translation: 6 right, 3 up',"A moved to A' (read: A prime). We write this translation as 6 right, 3 up. Now every point must move the same way.");
  await wait(3500);
  items=[orig];

  // --- Method 1
  cap('Method 1: Same move for every point','Every vertex slides 6 right and 3 up. Move A, then B, then C, and plot each new point.');
  await wait(2200);const newP=[];
  for(let i=0;i<3;i++){const P=[A,B,C][i],c=cols[i];
    const d=await pop({t:'dot',x:P[0],y:P[1],c,l:names[i]});
    const l1=await line(P[0],P[1],P[0]+6,P[1],c,800);const t1=await tag(P[0]+3,P[1]-.55,'6 right');
    const l2=await line(P[0]+6,P[1],P[0]+6,P[1]+3,c,700);const t2=await tag(P[0]+6.95,P[1]+1.5,'3 up');
    await pop({t:'dot',x:P[0]+6,y:P[1]+3,c,l:names[i]+"'"});newP.push([P[0]+6,P[1]+3]);
    await wait(600);rm(t1);rm(t2);rm(l1);rm(l2);rm(d);
  }
  cap('Join the dots!',"Join A', B' and C' to make the new triangle. It is the same shape and size, just in a new place.");
  await newTriangle(newP,BLUE);
  await wait(3500);
  items=[orig];

  // --- Method 2
  cap('Method 2: Start with one point',"Now we are told to move A to a NEW point, A' at (7, 3). Plot A' first.");
  await pop({t:'dot',x:1,y:1,c:RED,l:'A'});await wait(800);
  const A2=await pop({t:'dot',x:7,y:3,c:RED,l:"A'"});await wait(1800);
  cap('Look at the original shape','How far is B from A? Count on the ORIGINAL: 3 right, 0 up.');
  const m1=await line(1,1,4,1,TEAL,800,false,8);const mt1=await tag(2.5,.5,'3 right');await wait(1800);
  cap("Copy it from A'","Start at A' and repeat the SAME distance: 3 right. That gives B'.");
  await line(7,3,10,3,TEAL,800,false,8);await tag(8.5,2.5,'3 right');await pop({t:'dot',x:10,y:3,c:TEAL,l:"B'"});await wait(1800);
  cap('Now find C',"On the original, C is 3 up from A. From A' go 3 up to find C'.");
  await line(1,1,1,4,PURP,800,false,8);await tag(1.9,2.5,'3 up');await wait(1500);
  await line(7,3,7,6,PURP,800,false,8);await tag(7.9,4.5,'3 up');await pop({t:'dot',x:7,y:6,c:PURP,l:"C'"});await wait(1500);
  items=items.filter(o=>o.t==='dot'||o===orig);
  cap('Join the dots!',"Join A', B' and C' to finish the new triangle.");
  await newTriangle([[7,3],[10,3],[7,6]],BLUE);await wait(1500);
  cap('Check it works!',"The whole shape moved 6 right and 2 up. Every point moved the same amount.");
  await line(1,1,7,3,'#333',900,true,3);await tag(4,2.6,'6 right, 2 up',{size:22,bg:'#ffe27a'});
  await wait(4000);

  // --- Summary
  cap('Remember!','1. Count along (x), then up or down (y). 2. Move EVERY point the same way. 3. Join the dots. The shape stays the same size and direction!');
  await wait(1500);
  rp.style.display='block';
}
rp.onclick=story;
story();
</script>
</body>
</html>
