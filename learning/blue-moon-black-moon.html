<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blue Moon & Black Moon</title>
<style>
html,body{margin:0;height:100%;background:#10173a;overflow:hidden;display:flex;align-items:center;justify-content:center}
#stage{position:relative}
canvas{width:100%;height:100%;display:block}
#replay{position:absolute;left:50%;bottom:4%;transform:translateX(-50%) rotate(-2deg);display:none;cursor:pointer;
 font:700 clamp(16px,2.6vw,30px) "Chalkboard SE","Marker Felt","Comic Neue","Trebuchet MS",sans-serif;
 background:#e76f51;color:#fff;border:0;padding:.5em 1.5em;border-radius:6px 10px 7px 9px;
 box-shadow:4px 6px 0 rgba(0,0,0,.35),0 0 0 5px #fbf6e8}
#replay:hover{transform:translateX(-50%) rotate(1deg) scale(1.05)}
#replay:focus-visible{outline:4px solid #f2b134;outline-offset:8px}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas><button id="replay">&#8635; Replay</button></div>
<script>
const TAU=Math.PI*2,P=29.53,W=1280,H=720,END=67.5;
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),stage=document.getElementById('stage'),btn=document.getElementById('replay');
const FONT='"Chalkboard SE","Marker Felt","Comic Neue","Trebuchet MS",sans-serif';
const LIT='#f6efd2',BLUE='#a9d6ff',CREAM='#fbf6e8',NAVY='#1f2a5a';
let S=1;
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const ease=t=>1-Math.pow(1-clamp(t),3);
const back=t=>{t=clamp(t);return 1+2.9*Math.pow(t-1,3)+1.9*Math.pow(t-1,2)};
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};

/* ---------- paper helpers ---------- */
function blobPts(x,y,r,seed,n=30,j=.03){const p=[];for(let i=0;i<n;i++){const a=i/n*TAU,k=1+(hash(seed*13+i)-.5)*2*j;p.push([x+Math.cos(a)*r*k,y+Math.sin(a)*r*k])}return p}
function rectPts(x,y,w,h,seed,j=1.6){const p=[];const side=(x0,y0,x1,y1,c)=>{for(let i=0;i<c;i++){const t=i/c;p.push([x0+(x1-x0)*t+(hash(seed+p.length)-.5)*2*j,y0+(y1-y0)*t+(hash(seed+p.length+99)-.5)*2*j])}};
 const m=Math.max(2,Math.round(w/60)),n=Math.max(2,Math.round(h/60));
 side(x,y,x+w,y,m);side(x+w,y,x+w,y+h,n);side(x+w,y+h,x,y+h,m);side(x,y+h,x,y,n);return p}
function poly(p){ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath()}
function cut(p,fill,edge=CREAM,ew=5,sh=1){
 ctx.save();poly(p);ctx.lineJoin='round';ctx.shadowColor='rgba(0,0,0,.4)';
 ctx.shadowOffsetX=3*sh*S;ctx.shadowOffsetY=5*sh*S;ctx.shadowBlur=6*sh*S;
 ctx.fillStyle=edge;ctx.strokeStyle=edge;ctx.lineWidth=ew||.01;ctx.fill();ctx.stroke();ctx.restore();
 poly(p);ctx.fillStyle=fill;ctx.fill()}
function rcut(cx,cy,w,h,rot,fill,seed,cb){ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);cut(rectPts(-w/2,-h/2,w,h,seed),fill);if(cb)cb();ctx.restore()}
function txt(s,x,y,size,color,align='center'){ctx.font='700 '+size+'px '+FONT;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillStyle=color;ctx.fillText(String(s),x,y)}
const CR=[[-.35,-.3,.18],[.3,.1,.22],[-.1,.45,.14],[.35,-.45,.1],[-.5,.2,.1]];
function craters(x,y,r,a=.17){ctx.fillStyle='rgba(60,50,90,'+a+')';CR.forEach(c=>{ctx.beginPath();ctx.arc(x+c[0]*r,y+c[1]*r,c[2]*r,0,TAU);ctx.fill()})}
function drawPhase(x,y,r,phi,lit,dark){
 ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=dark;ctx.fill();
 let p=((phi%TAU)+TAU)%TAU;const wan=p>Math.PI;if(wan)p=TAU-p;
 const c=Math.cos(p),a=Math.max(.01,Math.abs(c)*r);
 ctx.save();ctx.translate(x,y);if(wan)ctx.scale(-1,1);
 ctx.beginPath();ctx.arc(0,0,r,-Math.PI/2,Math.PI/2,false);
 if(c>0)ctx.ellipse(0,0,a,r,0,Math.PI/2,-Math.PI/2,true);else ctx.ellipse(0,0,a,r,0,Math.PI/2,Math.PI*1.5,false);
 ctx.closePath();ctx.fillStyle=lit;ctx.fill();ctx.restore();craters(x,y,r)}
function phaseName(phi){const f=(((phi/TAU)%1)+1)%1;return f<.03||f>.97?'New Moon':f<.22?'Waxing Crescent':f<.28?'First Quarter':f<.47?'Waxing Gibbous':f<.53?'Full Moon':f<.72?'Waning Gibbous':f<.78?'Last Quarter':'Waning Crescent'}
const phiAt=(t,b)=>(b?Math.PI:0)+TAU*(t-.3)/P;

/* ---------- timeline ---------- */
function state(T){
 if(T<13)return{sc:'A',phi:TAU*clamp((T-.5)/12)};
 if(T<59){const b=T<36,e=T-(b?13:36),td=clamp((e-4)/14)*31;
  return{sc:b?'B':'C',b,e,td,cal:1,phi:phiAt(td,b),lit:(b&&td>=29.83)?BLUE:LIT}}
 return{sc:'D',phi:(T-59)*.6+1}}
const CAP=[
 [4.4,8.4,'The Moon circles Earth once every 29.5 days.'],
 [8.4,12.6,'Sunlight always lights half the Moon. We see different amounts: phases!'],
 [13.6,17,'A calendar month has 30 or 31 days. A Moon cycle takes 29.5.'],
 [17,21,'This month starts with a Full Moon on day 1.'],
 [21,29.8,'Watch the Moon travel around Earth, day by day...'],
 [29.8,32,'A second Full Moon arrives on day 30!'],
 [32,35.6,'Two Full Moons in one month = a Blue Moon.'],
 [36.6,40,'Now the other way: a month that starts with a New Moon.'],
 [40,44,'Day 1: a New Moon. The lit side faces away from us.'],
 [44,52.4,'Watch the Moon travel around Earth, day by day...'],
 [52.4,55,'A second New Moon arrives on day 30!'],
 [55,58.6,'Two New Moons in one month = a Black Moon.'],
 [63.2,99,'A Moon cycle is 29.5 days, shorter than most months. So sometimes it fits twice!']];

/* ---------- scene pieces ---------- */
function stars(T){ctx.fillStyle='rgba(251,246,232,.8)';for(let i=0;i<36;i++){const x=hash(i)*W,y=hash(i+50)*H,r=(2+hash(i+90)*3.5)*(1+.25*Math.sin(T*2+i));
 poly([[x,y-r*1.7],[x+r*.6,y],[x,y+r*1.7],[x-r*.6,y]]);ctx.fill();poly([[x-r*1.7,y],[x,y-r*.6],[x+r*1.7,y],[x,y+r*.6]]);ctx.fill()}}

function diagram(T,st){
 const EX=430,EY=330,R=150,sx=-10,sy=330,sr=150;
 ctx.save();ctx.translate(sx,sy);ctx.rotate(T*.08);
 for(let i=0;i<14;i++){const a=i/14*TAU,w=.13,c=Math.cos,s=Math.sin;
  cut([[c(a-w)*sr*.9,s(a-w)*sr*.9],[c(a)*sr*1.32,s(a)*sr*1.32],[c(a+w)*sr*.9,s(a+w)*sr*.9]],i%2?'#f2994a':'#f6b73c',CREAM,3,.6)}
 ctx.restore();
 cut(blobPts(sx,sy,sr,5),'#f9c846');cut(blobPts(sx,sy,sr*.72,6),'#fbd96b','#fbd96b',0,0);
 txt('Sun',72,330,30,'#9a5b12');
 [250,330,410].forEach((y,i)=>{ctx.save();ctx.translate(196,y);cut([[0,-16],[24,-16],[42,0],[24,16],[0,16],[16,0]],'#f9c846',CREAM,3,.6);ctx.restore()});
 ctx.save();ctx.setLineDash([16,14]);ctx.strokeStyle='rgba(251,246,232,.6)';ctx.lineWidth=4;ctx.beginPath();ctx.arc(EX,EY,R,0,TAU);ctx.stroke();ctx.restore();
 const ep=blobPts(EX,EY,50,9);cut(ep,'#2f80c4');
 ctx.save();poly(ep);ctx.clip();const sh=(T*6)%140;ctx.fillStyle='#7fbf5a';
 [[-50,-12,20,1],[-8,20,15,2],[28,-22,17,3],[52,10,13,4]].forEach(l=>[0,-140].forEach(k=>{poly(blobPts(EX+l[0]+sh+k,EY+l[1],l[2],l[3],14,.12));ctx.fill()}));ctx.restore();
 txt('Earth',EX,EY+82,20,CREAM);
 const mx=EX-R*Math.cos(st.phi),my=EY+R*Math.sin(st.phi),lit=st.lit||LIT;
 cut(blobPts(mx,my,32,11),'#4b5390',CREAM,4);
 ctx.beginPath();ctx.arc(mx,my,31,Math.PI/2,Math.PI*1.5,false);ctx.closePath();ctx.fillStyle=lit;ctx.fill();craters(mx,my,32,.18);
 txt('Moon',mx,my-50,18,CREAM)}

function earthView(T,st){
 const cx=1000,cy=295;
 rcut(cx,cy,290,290,.02,'#34459a',21,()=>txt('Seen from Earth',0,-118,19,CREAM));
 drawPhase(cx,cy+15,88,st.phi,st.lit||LIT,'#161b45');
 ctx.save();ctx.setLineDash([8,8]);ctx.strokeStyle='rgba(251,246,232,.55)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy+15,93,0,TAU);ctx.stroke();ctx.restore();
 txt(phaseName(st.phi),cx,470,30,CREAM);
 if(!st.cal)return;
 const sn=[(st.e-4)-14*.3/31,(st.e-4)-14*29.83/31],k=sn[1]>=0?1:sn[0]>=0?0:-1;if(k<0)return;
 const b=st.b,l1=k?(b?'Full Moon #2 = Blue Moon!':'New Moon #2 = Black Moon!'):(b?'Full Moon #1':'New Moon #1');
 const l2=k?(b?"(It isn't really blue!)":"(We just can't see it!)"):'';
 const fill=k?(b?'#8ec5ff':'#14172e'):'#ffe08a',col=(k&&!b)?CREAM:NAVY;
 ctx.font='700 24px '+FONT;const w=ctx.measureText(l1).width+50,sc=back(sn[k]/.5);
 ctx.save();ctx.translate(cx,545);ctx.scale(sc,sc);
 rcut(0,0,w,l2?68:48,-.03,fill,60+k,()=>{txt(l1,0,l2?-12:0,24,col);if(l2)txt(l2,0,16,17,col)});ctx.restore()}

function calendar(T,st){
 const off=(1-ease(st.e))*150,b=st.b;
 txt('A 31-day month',20,604+off,18,CREAM,'left');
 for(let i=0;i<31;i++){
  if(st.td<i)continue;
  const cur=Math.floor(Math.min(st.td,30.99))===i,ev=(i===0&&st.td>=.3)?1:(i===29&&st.td>=29.83)?2:0;
  const fill=ev===1?(b?'#fff1b8':'#d7d2f0'):ev===2?(b?'#8ec5ff':'#2b2b45'):cur?'#ffe9a8':CREAM;
  const dk=ev===2&&!b,y=620+off-(cur?8:0),x=20+i*40+18;
  rcut(x,y+36,36,72,0,fill,100+i,()=>txt(i+1,0,-21,15,dk?CREAM:NAVY));
  drawPhase(x,y+54,12,phiAt(i+.5,b),(ev===2&&b)?CREAM:'#f2b134','#3a4175');
  ctx.strokeStyle=dk?CREAM:NAVY;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y+54,12,0,TAU);ctx.stroke()}}

function cards(T){
 [[59.6,230,-.026,'Blue Moon','2 Full Moons in one month',BLUE,'#4da3ff',0],[61.4,440,.02,'Black Moon','2 New Moons in one month','#14172e','#6d5bd0',1]].forEach(c=>{
  if(T<c[0])return;const sc=back((T-c[0])/.6);
  ctx.save();ctx.translate(900,c[1]);ctx.scale(sc,sc);
  rcut(0,0,490,190,-c[2]*1.6,c[6],70+c[7]);
  rcut(0,0,470,170,c[2],CREAM,72+c[7],()=>{
   cut(blobPts(-170,0,52,40+c[7]),c[5],CREAM,4);
   if(c[7]){ctx.save();ctx.setLineDash([8,7]);ctx.strokeStyle=NAVY;ctx.lineWidth=3;ctx.beginPath();ctx.arc(-170,0,62,0,TAU);ctx.stroke();ctx.restore()}else craters(-170,0,52);
   txt(c[3],60,-28,40,NAVY);txt(c[4],60,28,22,'#3a4175')});
  ctx.restore()})}

function caption(T){
 const L=CAP.find(c=>T>=c[0]&&T<c[1]);if(!L)return;
 const k=ease((T-L[0])/.4)*clamp((L[1]-T)/.3),bot=L[0]>=63,y=bot?570:58;
 ctx.font='700 24px '+FONT;const w=Math.min(1240,ctx.measureText(L[2]).width+70);
 ctx.save();ctx.globalAlpha=k;ctx.translate(0,(1-k)*(bot?30:-30));
 rcut(640,y,w,56,-.008,CREAM,Math.floor(L[0])+40,()=>txt(L[2],0,2,24,NAVY));ctx.restore()}

function title(T){
 if(T>=4.9)return;const sc=back(T/.6),dy=-ease((T-4)/.8)*700;
 ctx.save();ctx.translate(640,360+dy);ctx.scale(sc,sc);
 rcut(0,0,800,270,.05,'#e76f51',31);
 rcut(0,0,780,250,-.03,CREAM,32,()=>{txt('Blue Moon & Black Moon',0,-28,56,NAVY);txt("Two full moons? Two new moons? Let's find out!",0,52,26,'#3a4175')});
 cut(blobPts(-345,-120,46,33),BLUE);craters(-345,-120,46);
 cut(blobPts(345,-120,46,34),'#14172e');ctx.restore()}

function wipe(T){[13,36,59].forEach(b=>{const p=(T-b+.4)/.8;if(p<=0||p>=1)return;const x0=W-(W+1700)*p;
 [['#f2b134',0,1700],['#e76f51',110,1480]].forEach(([c,o,w],k)=>{const pts=[];
  for(let y=0;y<=H;y+=36)pts.push([x0+o+(hash(y+k*7)-.5)*30,y]);
  for(let y=H;y>=0;y-=36)pts.push([x0+o+w+(hash(y+k*7+3)-.5)*30,y]);cut(pts,c)})})}

const gc=document.createElement('canvas');gc.width=gc.height=160;
{const g=gc.getContext('2d');for(let i=0;i<2200;i++){g.fillStyle=Math.random()<.5?'rgba(255,255,255,.1)':'rgba(0,0,0,.1)';g.fillRect(Math.random()*160,Math.random()*160,1+Math.random()*1.5,1+Math.random()*1.5)}}

function frame(T){
 ctx.setTransform(S,0,0,S,0,0);ctx.fillStyle=NAVY;ctx.fillRect(0,0,W,H);
 stars(T);const st=state(T);
 diagram(T,st);
 if(st.sc!=='D')earthView(T,st);
 if(st.cal)calendar(T,st);
 if(st.sc==='D')cards(T);
 caption(T);title(T);wipe(T);
 ctx.fillStyle=ctx.createPattern(gc,'repeat');ctx.fillRect(0,0,W,H)}

/* ---------- playback ---------- */
let t0=0,raf=0,done=false;
function resize(){const dpr=window.devicePixelRatio||1,w=Math.min(innerWidth,innerHeight*16/9);
 stage.style.width=w+'px';stage.style.height=w*9/16+'px';cv.width=Math.round(w*dpr);cv.height=Math.round(w*9/16*dpr);S=cv.width/W;if(done)frame(END)}
function loop(now){const T=clamp((now-t0)/1000,0,END);frame(T);
 if(T>=END){done=true;btn.style.display='block';btn.focus({preventScroll:true});return}
 raf=requestAnimationFrame(loop)}
function start(){done=false;btn.style.display='none';cancelAnimationFrame(raf);t0=performance.now();raf=requestAnimationFrame(loop)}
btn.addEventListener('click',start);
addEventListener('resize',resize);
resize();start();
</script>
</body>
</html>
