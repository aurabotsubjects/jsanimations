<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

*{box-sizing:border-box}

/* ---------- paper scenery ---------- */

const cloud=(id,x,y)=>`<g id="${id}" class="cut" style="transform:translate(${x}px,${y}px)" fill="#fffaf0"><ellipse cx="28" cy="10" rx="46" ry="16"/><circle cx="14" cy="-2" r="20"/><circle cx="42" cy="-8" r="26"/></g>`;

const fc=['#ff8fa3','#ffd166','#cdb4db','#fffaf0','#ff9f68'];
for(let i=0;i<24;i++){const x=14+i*34+(i*17%11),y=412+(i*13%16);fl+=`<path d="M${x} 450V${y}" style="stroke:#2f6b2f;stroke-width:3;fill:none"/><circle cx="${x}" cy="${y}" r="8" fill="${fc[i%5]}"/><circle cx="${x}" cy="${y}" r="3.2" fill="#ffd54a"/>`}
$('#sv').innerHTML=`<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="1.5" dy="3" stdDeviation="1.8" flood-color="#2a1a0a" flood-opacity=".4"/></filter>

<rect width="800" height="450" fill="#a8d8e0"/>

${cloud('c1',90,60)}${cloud('c2',420,40)}
<g filter="url(#rf)"><path d="M0 300Q120 250 260 295T520 285T800 300V380H0Z" fill="#9ccb86"/><path d="M0 332Q160 285 320 325T620 320T800 332V400H0Z" fill="#79b265"/></g>

<g id="bush" filter="url(#rf)" style="transform-origin:720px 402px"><circle cx="690" cy="365" r="36" fill="#2f7a3a"/><circle cx="735" cy="352" r="46" fill="#3f9148"/><circle cx="765" cy="375" r="27" fill="#2f7a3a"/><circle cx="712" cy="372" r="30" fill="#56a85a"/>
<g fill="#e63946"><circle cx="700" cy="345" r="3.5"/><circle cx="740" cy="335" r="3.5"/><circle cx="760" cy="368" r="3.5"/><circle cx="722" cy="372" r="3.5"/></g></g>
<g filter="url(#rf)"><path d="M0 432Q120 420 240 434T480 432T800 434V450H0Z" fill="#468239"/></g><g class="cut">${fl}</g>

$('#c1').animate([{transform:'translate(90px,60px)'},{transform:'translate(190px,60px)'}],{duration:22000,direction:'alternate',iterations:Infinity,easing:'ease-in-out'});

/* ---------- helpers ---------- */

const search=(a,i=0)=>{const[r,d,p]=a.sn;
a.m.animate([{transform:`translateX(${-p}px) rotate(-1.5deg)`},{transform:`translateX(${p}px) rotate(1.5deg)`}],{duration:d*1.6,direction:'alternate',iterations:Infinity,easing:'ease-in-out',delay:-i*300});

/* ---------- the story ---------- */
const T=["One sunny day an old woman was in her garden, gardening.",
"She had her glasses on, and when she went to adjust them, they were not there!",
"After hours of looking, she had to ask for help. She asked the horse for help.",
"As much as the old woman and the horse looked, they could not find the glasses, so the horse stamped his feet down and called the deer for help.",
"As much as the old woman, the horse and the deer looked, they could still not find the glasses, so the deer called for the dog for more help.",
"As the old woman, the horse, the deer and the dog looked as much as they could, they still could not find the glasses, so the dog waved his tail and shouted for the cat for help.",
"As much as the old woman, the horse, the deer, the dog and the cat looked, they STILL!! could not find the glasses. So the cat wiggled his ears and yelled for the duck for help.",
"As much as the old woman, the horse, the deer, the dog, the cat and the duck looked, they could not find it. So the duck called for the mouse for help.",
"As the mouse went to look under the bush, he noticed something poking out of the bush, so he went under the bush and...",
"FOUND IT! The glasses! Everyone cheered."];
const KIDS=['horse','deer','dog','cat','duck'],CALL=['Deer, help!','Dog, help!','Cat, help!!','Duck, HELP!','Mouse, help!'],
ACT=[a=>{wob(a.fl,-17,8,130);hop(a,6,4,260)},a=>a.hd.animate([{transform:'rotate(0)'},{transform:'rotate(-30deg)',offset:.3},{transform:'rotate(-30deg)',offset:.7},{transform:'rotate(0)'}],{duration:1100,composite:'add'}),
a=>wob(a.tl,30,14,110),a=>wob(a.er,18,14,100),a=>hop(a,16,3,320)];
