<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Scratch Pad</title>
<style>
html,body{margin:0;height:100%;background:#2e2620;overflow:hidden}
body{display:grid;place-items:center}
#stage{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;container-type:inline-size;background:#a9cfc4;overflow:hidden;font-family:"Chalkboard SE","Marker Felt","Segoe Print","Comic Sans MS",cursive}
svg{position:absolute;inset:0;width:100%;height:100%}
#grain{pointer-events:none;opacity:.35;z-index:1}
.s,#fg>g{filter:drop-shadow(2px 4px 2px rgba(40,25,10,.35))}
#capw{position:absolute;top:2.2cqw;left:50%;translate:-50% 0;width:84cqw;filter:drop-shadow(0 .4cqw .4cqw rgba(0,0,0,.3));rotate:-.4deg;z-index:2;transition:opacity .25s}
#capw.off{opacity:0}
#capw::before{content:"";position:absolute;top:-1.1cqw;left:44%;width:12cqw;height:2.6cqw;background:rgba(240,120,90,.8);rotate:-3deg;z-index:3}
#cap{background:#fff7e1;color:#3a2a1e;font-size:2.5cqw;line-height:1.35;padding:1.3cqw 3cqw;text-align:center;min-height:1.35em;clip-path:polygon(0 8%,1.5% 0,40% 3%,99% 0,100% 6%,99% 94%,100% 100%,60% 97%,1% 100%,0 92%)}
#re{position:absolute;left:50%;bottom:2cqw;translate:-50% 0;rotate:-2deg;z-index:3;font:inherit;font-size:2.6cqw;padding:.8cqw 3cqw;border:.3cqw solid #fff7e1;background:#f0785a;color:#fff;cursor:pointer;box-shadow:.3cqw .5cqw 0 rgba(0,0,0,.3);transition:opacity .6s}
#re:disabled{opacity:0;pointer-events:none}
#re:hover{background:#e0603f}
#re:focus-visible{outline:.4cqw solid #fff7e1}
</style>
</head>
<body>
<div id="stage">
 <svg viewBox="0 0 960 540" aria-hidden="true"><g id="bg"></g><g id="fg"></g><g id="top"></g></svg>
 <svg id="grain"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .3  0 0 0 0 .2  0 0 0 0 .1  0 0 0 .5 -.1"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
 <div id="capw" class="off" role="status"><div id="cap"></div></div>
 <button id="re" disabled>Replay</button>
</div>
<script>
const NS='http://www.w3.org/2000/svg',$=s=>document.querySelector(s),R=(a,b)=>a+Math.random()*(b-a),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const lin=e=>e,io=e=>e<.5?2*e*e:1-2*(1-e)*(1-e),eo=e=>1-(1-e)*(1-e),ei=e=>e*e,eb=e=>1+2.7*Math.pow(e-1,3)+1.7*Math.pow(e-1,2);
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
function ap(g){const t=g.t;g.setAttribute('transform',`translate(${t.x} ${t.y}) rotate(${t.r+t.w}) scale(${t.s})`);g.setAttribute('opacity',t.o);g.hk&&g.hk()}
function node(p,x=0,y=0){const g=el('g',{},p);g.t={x,y,r:0,s:1,o:1,w:0};ap(g);return g}
function hide(g,sc=1){g.sc=sc;g.t.s=0;ap(g)}
function anim(ms,f,ez=io){return new Promise(res=>{const t0=performance.now();(function s(t){const p=Math.min(1,(t-t0)/ms);f(ez(p));p<1?requestAnimationFrame(s):res()})(t0)})}
function tw(g,to,ms=500,ez=io){const f={};for(const k in to)f[k]=g.t[k];return anim(ms,e=>{for(const k in to)g.t[k]=f[k]+(to[k]-f[k])*e;ap(g)},ez)}
/* paper shapes: scissor-cut polygons with a white paper edge */
function poly(p,pts,f,j=2,sw=2){return el('path',{d:pts.map(([x,y],i)=>(i?'L':'M')+(x+R(-j,j)).toFixed(1)+' '+(y+R(-j,j)).toFixed(1)).join('')+'Z',fill:f,stroke:'#fffaf0','stroke-width':sw,'stroke-linejoin':'round'},p)}
const rect=(p,x,y,w,h,f,j,sw)=>poly(p,[[x,y],[x+w,y],[x+w,y+h],[x,y+h]],f,j,sw);
const ell=(p,cx,cy,rx,ry,f,j=1.5,sw=2,n=14)=>poly(p,Array.from({length:n},(_,i)=>[cx+rx*Math.cos(i*2*Math.PI/n),cy+ry*Math.sin(i*2*Math.PI/n)]),f,j,sw);
const txt=(p,s,x,y,size,fill='#3b2a1a',w='normal')=>{const t=el('text',{x,y,'font-size':size,fill,'text-anchor':'middle','font-weight':w},p);t.textContent=s;return t};

let fg,topL,W=[],girl,brother,sister,mum,dad,cat,pad,st,HL;
const capw=$('#capw'),cap=$('#cap'),re=$('#re');
async function C(s){capw.classList.add('off');await sleep(260);cap.textContent=s;capw.classList.remove('off')}

function bg(){
 const b=$('#bg'),S2=()=>el('g',{class:'s'},b);
 rect(b,-10,-10,980,430,'#a9cfc4',0,0);
 for(let y=130,i=0;y<400;y+=55,i++)for(let x=i%2?60:20;x<960;x+=80)ell(b,x,y,5,5,'#c3e3d8',.8,0,8);
 const w=S2();rect(w,380,120,170,150,'#fff7e1',2);
 [[390,130,70,64],[470,130,70,64],[390,204,70,56],[470,204,70,56]].forEach(a=>rect(w,...a,'#8fd0f0',1,0));
 ell(w,425,162,15,15,'#ffd34e',1,0);ell(w,508,156,22,9,'#fff',1,0);ell(w,522,150,13,9,'#fff',1,0);
 const pc=S2();rect(pc,720,135,120,88,'#f3e7cf',2);rect(pc,730,145,100,68,'#f6b8a0',1,0);
 poly(pc,[[730,213],[765,175],[795,200],[815,182],[830,213]],'#6fbf73',1,0);ell(pc,805,163,9,9,'#ffd34e',.8,0);
 rect(b,-10,410,980,140,'#c78b57',0,0);[445,480,515].forEach(y=>rect(b,0,y,960,3,'#a96f3f',.5,0));
 rect(b,-10,392,980,22,'#f3e7cf',1);
 const rg=S2();ell(rg,500,478,390,54,'#e9a98d',2.5,0,28);ell(rg,500,478,340,42,'#f6d3bd',2,0,28);ell(rg,500,478,290,30,'#e9a98d',2,0,28);
 const cu=S2();ell(cu,110,490,58,13,'#d9618a');ell(cu,110,484,48,9,'#ec86a8',1);
}

function person(h,o,x){
 const g=node(fg,x,495),hr=h*.19,hy=-h*.81;g.h=h;hide(g);W.push(g);
 if(o.hs=='long'){rect(g,-hr*1.1,hy-hr*.2,hr*.5,h*.3,o.hair,1);rect(g,hr*.6,hy-hr*.2,hr*.5,h*.3,o.hair,1)}
 if(o.hs=='pig'){ell(g,-hr*1.3,hy+hr*.5,hr*.4,hr*.55,o.hair,1);ell(g,hr*1.3,hy+hr*.5,hr*.4,hr*.55,o.hair,1)}
 if(o.hs=='bun')ell(g,0,hy-hr*1.1,hr*.45,hr*.4,o.hair,1);
 rect(g,-h*.1,-h*.22,h*.08,h*.22,o.pants,1);rect(g,h*.02,-h*.22,h*.08,h*.22,o.pants,1);
 const arm=s=>{poly(g,[[s*h*.13,-h*.6],[s*h*.2,-h*.58],[s*h*.23,-h*.32],[s*h*.16,-h*.3]],o.shirt,1);ell(g,s*h*.2,-h*.29,h*.035,h*.035,o.skin,.5,1.5)};
 arm(-1);if(!o.girl)arm(1);
 const bw=o.dress?.27:.19,bb=o.dress?.16:.22;
 poly(g,[[-h*.14,-h*.62],[h*.14,-h*.62],[h*bw,-h*bb],[-h*bw,-h*bb]],o.shirt,1);
 ell(g,0,hy,hr,hr,o.skin,1);
 const r=hr*1.1,p=[];for(let i=0;i<=8;i++){const a=Math.PI+i*Math.PI/8;p.push([Math.cos(a)*r,hy+Math.sin(a)*r+hr*.12])}
 p.push([hr*.6,hy-hr*.25],[0,hy-hr*.05],[-hr*.6,hy-hr*.25]);poly(g,p,o.hair,1);
 [-1,1].forEach(s=>{ell(g,s*hr*.4,hy+hr*.15,Math.max(1.8,hr*.09),Math.max(2.2,hr*.11),'#2b1d14',0,0);ell(g,s*hr*.62,hy+hr*.5,hr*.2,hr*.14,'#f08d8d',0,0,8).setAttribute('opacity',.55)});
 const m=el('path',{fill:'none',stroke:'#7a2d3a','stroke-width':2.2,'stroke-linecap':'round'},g);
 g.mset=q=>{const w=hr*.3,y=hy+hr*.55,D={smile:`M${-w} ${y}Q0 ${y+w*.9} ${w} ${y}`,sad:`M${-w} ${y+w*.5}Q0 ${y-w*.7} ${w} ${y+w*.5}`,open:`M${-w} ${y}Q0 ${y+w*1.8} ${w} ${y}Z`,flat:`M${-w*.6} ${y+2}L${w*.6} ${y+2}`};m.setAttribute('d',D[q]);m.setAttribute('fill',q=='open'?'#7a2d3a':'none')};
 g.mset('smile');return g}

function mkCat(){
 const g=node(fg,110,492);g.h=95;hide(g,1.3);W.push(g);
 const tail=node(g,-28,-14);poly(tail,[[0,2],[-14,-6],[-24,-24],[-30,-42],[-37,-41],[-34,-20],[-22,2],[-6,10]],'#e8913a',1);g.tail=tail;
 rect(g,-18,-8,9,9,'#d97f2a',1);rect(g,6,-8,9,9,'#d97f2a',1);ell(g,-8,-18,30,18,'#e8913a');
 poly(g,[[-14,-34],[-9,-24],[-19,-24]],'#b85f1c',0,0);poly(g,[[-2,-35],[3,-24],[-7,-24]],'#b85f1c',0,0);
 poly(g,[[12,-52],[16,-70],[26,-58]],'#e8913a',.8);poly(g,[[26,-58],[36,-69],[38,-50]],'#e8913a',.8);
 ell(g,26,-46,17,15,'#e8913a');ell(g,21,-48,2.8,3.6,'#3d8f4f',0,0);ell(g,32,-48,2.8,3.6,'#3d8f4f',0,0);
 poly(g,[[37,-44],[43,-44],[40,-41]],'#f08d9a',0,0);return g}

const S={skip:{step:80,hop:26,ms:300,tilt:7},hurry:{step:65,hop:9,ms:170,tilt:4},stroll:{step:55,hop:6,ms:480,tilt:2},stomp:{step:50,hop:11,ms:380,tilt:5}};
async function walk(g,x,s){const y0=g.t.y,n=Math.max(1,Math.round(Math.abs(g.t.x-x)/s.step)),dx=(x-g.t.x)/n;
 for(let i=0;i<n;i++)await Promise.all([tw(g,{x:g.t.x+dx},s.ms,lin),tw(g,{y:y0-s.hop,r:i%2?s.tilt:-s.tilt},s.ms/2,eo).then(()=>tw(g,{y:y0},s.ms/2,ei))]);
 g.t.r=0;ap(g)}
async function shake(g,n=6,a=3,ms=70){const r=g.t.r;for(let i=0;i<n;i++)await tw(g,{r:r+(i%2?a:-a)},ms);await tw(g,{r},ms)}
async function lean(p){await tw(p,{r:-9},220);await sleep(300);await tw(p,{r:0},220)}

async function say(who,s,hold=1400){
 const L=s.split('\n'),w=Math.max(...L.map(l=>l.length))*10.5+34,h=L.length*27+16,px=Math.min(Math.max(who.t.x,w/2+10),950-w/2),d=Math.max(-w/2+22,Math.min(w/2-22,who.t.x-px));
 const b=node(fg,px,who.t.y-who.h*(who.sc||1)-4);
 poly(b,[[d-10,-18],[d+10,-18],[d,0]],'#fffbf0',.5);rect(b,-w/2,-16-h,w,h,'#fffbf0',1.5);
 L.forEach((l,i)=>txt(b,l,0,-16-h+30+i*27,21));
 b.t.s=0;await tw(b,{s:1},260,eb);await sleep(hold);await tw(b,{s:0,o:0},180);b.remove()}

const ITEM={
 car:g=>{rect(g,-22,-4,44,12,'#d64545',1);rect(g,-10,-13,20,10,'#e86a6a',1);rect(g,-6,-11,5,6,'#cfeaf5',.5,0);rect(g,2,-11,5,6,'#cfeaf5',.5,0);ell(g,-12,9,5.5,5.5,'#2b2b2b',.5,1.5);ell(g,12,9,5.5,5.5,'#2b2b2b',.5,1.5)},
 pencil:g=>{rect(g,-30,-4,52,8,'#f2c230',.8);rect(g,-35,-4,6,8,'#ec7f9a',.5);poly(g,[[22,-4],[34,0],[22,4]],'#e8c9a0',.4,1.5);poly(g,[[29,-1.5],[34,0],[29,1.5]],'#333',0,0)},
 book:g=>{rect(g,-27,-14,54,28,'#6a4fb3',1);rect(g,-21,-9,42,5,'#f4e3a0',.5,0);rect(g,-21,0,30,3,'#f4e3a0',.5,0)},
 form:g=>{rect(g,-20,-27,40,54,'#fff',1);[-18,-10,-2].forEach(y=>rect(g,-14,y,28,3,'#9aa5b1',.4,0));rect(g,-14,10,9,9,'#f2c230',.4,0)}};
const SND={car:'whirr!',pencil:'clatter!',book:'thud!',form:'swish!'};
async function sweep(k,snd){
 const g=node(fg,385,462);ITEM[k](g);W.push(g);
 if(snd){const s=node(fg,500+R(-40,40),405);s.t.s=0;const t=txt(s,SND[k],0,0,32,'#ffe27a','bold');t.setAttribute('stroke','#3b2a1a');t.setAttribute('stroke-width',6);t.setAttribute('paint-order','stroke');
  tw(s,{s:1,r:R(-8,8)},250,eb).then(()=>sleep(500)).then(()=>tw(s,{o:0},250)).then(()=>s.remove())}
 const slow=k=='book'||k=='form';if(k=='form')g.t.r=-6;
 await tw(g,{x:615,r:k=='pencil'?720:k=='book'?6:g.t.r},slow?800:700,slow?eo:lin);
 await tw(g,{o:0},150);g.remove()}

async function scratch(n=3){
 await tw(st,{x:92,y:-40},250);
 for(let i=0;i<n;i++){await Promise.all([tw(st,{x:104},130),tw(girl,{r:5},130)]);await Promise.all([tw(st,{x:86},130),tw(girl,{r:1},130)])}
 await Promise.all([tw(st,{x:40,y:-70},250),tw(girl,{r:0},250)])}
async function fail(){
 girl.mset('sad');const x=node(fg,500,400);x.t.s=0;
 [45,-45].forEach(r=>{const a=node(x);a.t.r=r;ap(a);rect(a,-4,-24,8,48,'#d64545',.8)});
 tw(x,{s:1},200,eb);await shake(pad,4,2.5,60);await sleep(450);await tw(x,{o:0},200);x.remove();girl.mset('flat')}
async function attempt(n,snd,nf){
 for(let j=n;j>=0;j--){await Promise.all([lean(HL[j].p),sweep(HL[j].k,snd&&j==n)]);await sleep(60)}
 await scratch(2);if(!nf)await fail()}
async function cry(ms){const e=Date.now()+ms;
 while(Date.now()<e){for(const s of[-1,1]){const t=node(girl,s*11,-112);poly(t,[[0,-6],[4,0],[0,5],[-4,0]],'#6ab7e8',.4,0);tw(t,{y:-62,o:0},750,ei).then(()=>t.remove())}await sleep(240)}}
async function hop(g,d=0){await sleep(d);const y=g.t.y;for(let i=0;i<3;i++){await tw(g,{y:y-34},190,eo);await tw(g,{y},190,ei)}}
function confetti(){for(let i=0;i<40;i++){const g=node(topL,R(30,930),-20);g.t.r=R(0,360);const w=R(8,14);
 rect(g,-w/2,-4,w,8,['#f2c230','#d64545','#4a90d9','#4aa86a','#a45fd6','#f0785a'][i%6],.5,0);
 const x0=g.t.x,d=R(2400,4200),sw=R(-40,40);
 setTimeout(()=>anim(d,p=>{g.t.y=-20+p*580;g.t.x=x0+Math.sin(p*9)*sw;g.t.r+=3;ap(g)},lin).then(()=>g.remove()),R(0,1200))}}

async function play(){
 re.disabled=true;fg=$('#fg');topL=$('#top');fg.innerHTML='';topL.innerHTML='';W=[];capw.classList.add('off');
 /* pad (lands later) */
 pad=node(fg,500,-120);W.push(pad);
 poly(pad,[[-125,-36],[125,-36],[150,36],[-150,36]],'#1d1b2a',1.5);
 ['#ff6b6b','#ffa94d','#ffe066','#69db7c','#4dabf7','#b197fc'].forEach((c,i)=>rect(pad,-60+i*20,26,18,6,c,.5,0));
 pad.arcs=[56,49,42,35,28,21].map((r,i)=>el('path',{d:`M${-r} 28A${r} ${r} 0 0 1 ${r} 28`,fill:'none',stroke:['#ff6b6b','#ffa94d','#ffe066','#69db7c','#4dabf7','#b197fc'][i],'stroke-width':6,'stroke-linecap':'round',pathLength:1,'stroke-dasharray':'1 1','stroke-dashoffset':1},pad));
 cat=mkCat();
 girl=person(150,{skin:'#f4c9a3',hair:'#5a3417',shirt:'#f2c230',pants:'#f4c9a3',dress:1,hs:'pig',girl:1},290);
 const arm=el('path',{fill:'none',stroke:'#f2c230','stroke-width':10,'stroke-linecap':'round'},girl);
 st=node(girl,40,-70);rect(st,-3,-17,6,40,'#c9a36b',.5,1.5);poly(st,[[-3,-17],[3,-17],[0,-29]],'#3a2a1e',0,0);rect(st,-3.5,17,7,6,'#e07a8a',.4,1.5);ell(st,0,-2,5.5,5.5,'#f4c9a3',.4,1.5);
 st.hk=()=>arm.setAttribute('d',`M16 -90L${st.t.x} ${st.t.y}`);ap(st);
 brother=person(120,{skin:'#e8b58f',hair:'#2d2a28',shirt:'#4a90d9',pants:'#2f4a7a',hs:'short'},400);
 sister=person(160,{skin:'#d9a47a',hair:'#1f1a1a',shirt:'#a45fd6',pants:'#4a3a6e',hs:'long'},510);
 mum=person(195,{skin:'#f4c9a3',hair:'#c0622f',shirt:'#d64545',pants:'#3a3a4a',hs:'bun'},640);
 dad=person(225,{skin:'#e8b58f',hair:'#4a3a2a',shirt:'#4aa86a',pants:'#3a4a6a',hs:'short'},790);
 HL=[{p:brother,k:'car',x:675,s:S.skip,c1:'When her brother walked past, she asked him to help.',c2:'So he drove a car across the scratch pad, and the little girl tried again, but it didn’t work.'},
  {p:sister,k:'pencil',x:745,s:S.hurry,c1:'When her sister walked past, the little girl asked her to help.',c2:'So she rolled a pencil across the scratch pad. The brother drove a car across it, and the little girl tried again, but it didn’t work.'},
  {p:mum,k:'book',x:825,s:S.stroll,c1:'When her Mum walked past, the little girl asked her to help.',c2:'So she skidded a book across the scratch pad. The sister rolled a pencil across it. The brother drove a car across it, and the little girl tried again, but it didn’t work.'},
  {p:dad,k:'form',x:915,s:S.stomp,c1:'When her Dad walked past, the little girl asked him to help.',c2:'So he slid a work form across the scratch pad. The Mum skidded a book across it. The sister rolled a pencil across it. The brother drove a car across it, and the little girl tried again, but it didn’t work.'}];

 /* title */
 const T=node(fg,480,260);T.t.r=-3;T.t.s=0;ap(T);rect(T,-290,-80,580,160,'#fff7e1',3);rect(T,-268,-62,536,124,'#f0785a',2,0);txt(T,'The Scratch Pad',0,22,68,'#fff7e1','bold');
 await sleep(400);await tw(T,{s:1},500,eb);await sleep(2200);await tw(T,{y:720,r:14},650,ei);T.remove();

 /* once upon a time */
 C('Once upon a time, a family of five lived in a small house.');await sleep(3200);
 C('There was a little girl, a brother, a sister, a Mum, a Dad, and a cat.');
 for(const g of[girl,brother,sister,mum,dad,cat]){await tw(g,{s:g.sc||1},350,eb);await sleep(250)}
 await sleep(1800);
 C('One day, the little girl was in her bedroom, playing with her scratch pad,');
 await Promise.all([brother,sister,mum,dad].map(p=>walk(p,1100,S.hurry)));
 await tw(pad,{y:470},600,eb);girl.mset('flat');await sleep(800);
 C('but she couldn’t scratch it. She tried and tried, but she couldn’t do it.');
 await scratch(3);await fail();await scratch(3);await fail();await sleep(600);

 /* the helpers */
 for(let i=0;i<4;i++){const H=HL[i];C(H.c1);await walk(H.p,H.x,H.s);await say(girl,'Please help me!',900);
  C(H.c2);await attempt(i,true);await sleep(700)}

 /* tears and the cat */
 await C('The little girl started to cry.');girl.mset('open');
 await Promise.all([cry(2400),shake(girl,26,3,90)]);
 C('“I will never be able to scratch my scratch pad!” she wailed.');
 await say(girl,'I will never be able to\nscratch my scratch pad!',2800);girl.mset('sad');
 C('The cat walked past and said, “Try again.”');await walk(cat,175,S.stroll);await say(cat,'Try again.',1500);
 C('So the Dad slid a work form across the scratch pad. The Mum skidded a book across it. The sister rolled a pencil across it. The brother drove a car across it, and the little girl tried again.');
 await attempt(3,false,true);girl.mset('flat');await sleep(600);

 /* the twist */
 C('But what none of them realised was that the little girl was holding the scratch pencil the wrong way.');
 await tw(st,{x:46,y:-80},300);
 for(let i=0;i<2;i++){await tw(st,{s:1.8},260);await tw(st,{s:1},260)}
 await sleep(1800);
 C('The cat told her to turn it the other way.');await say(cat,'Turn it the\nother way!',1700);
 await tw(st,{r:180,y:-90},700);await tw(st,{y:-70},200);
 C('She did, and now it worked!');girl.mset('open');
 await Promise.all([anim(1900,p=>pad.arcs.forEach((a,i)=>a.setAttribute('stroke-dashoffset',1-Math.min(1,Math.max(0,p*6.5-i*.9)))),lin),scratch(6)]);
 girl.mset('smile');confetti();
 [girl,...HL.map(h=>h.p),cat].forEach((g,i)=>hop(g,i*90));
 await sleep(3200);
 await C('The End');await sleep(1200);
 re.disabled=false}
