<!DOCTYPE html>

<title>The Tortoise in the Movie</title>
<style>
  html,body{margin:0;height:100%;background:#2a1f17;overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block}
  #replayWrap{
    position:fixed;left:50%;top:40%;
    transform:translate(-50%,-50%) rotate(-2deg) scale(.5);
    opacity:0;pointer-events:none;
    transition:opacity .5s ease, transform .6s cubic-bezier(.2,1.4,.4,1);
    filter:drop-shadow(4px 7px 5px rgba(30,15,5,.45));
  }
  #replayWrap.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) rotate(-2deg) scale(1)}
  #replay{
    display:block;border:0;cursor:pointer;padding:22px 52px;
    font:700 clamp(24px,4.2vw,42px) "Comic Sans MS","Chalkboard SE","Marker Felt","Segoe Print","Comic Neue",system-ui,sans-serif;
    color:#3a2a1c;background:#ffd166;
    clip-path:polygon(2% 8%,18% 0,40% 5%,63% 0,86% 6%,100% 3%,98% 38%,100% 66%,97% 100%,74% 94%,52% 100%,28% 95%,6% 100%,0 70%,3% 40%);
  }
  #replay:hover{background:#ffc233}
</style>
</head>
<body>
<div id="stage"><canvas id="c" aria-label="A paper cut-out animation of The Tortoise in the Movie"></canvas></div>
<div id="replayWrap"><button id="replay" type="button">&#8635; Replay</button></div>

<script>
(function () {
'use strict';

/* ============================================================
   Basics
   ============================================================ */
var W = 1280, H = 720, FPS = 12, TAU = Math.PI * 2, FY = 610, END = 111.5;
var cv = document.getElementById('c'), ctx = cv.getContext('2d');
var wrapEl = document.getElementById('replayWrap'), btn = document.getElementById('replay');
var SC = 1, SHS = 1, F = 0, PAPER = null;
var FONT = '"Comic Sans MS","Chalkboard SE","Marker Felt","Segoe Print","Comic Neue",system-ui,sans-serif';

var eo = function (p) { return 1 - Math.pow(1 - p, 3); };

  var n = 7.5625, d = 2.75;
  if (p < 1 / d) return n * p * p;

function hash(n) {

}
var hopAt = function (t, t0, d, hgt) { return (t >= t0 && t < t0 + d) ? hgt * Math.sin((t - t0) / d * Math.PI) : 0; };

/* ============================================================

function makePaper() {
  var c = document.createElement('canvas'); c.width = c.height = 220;
  var g = c.getContext('2d'), r = rnd(7), i;

    g.fillStyle = r() < .5 ? 'rgba(255,255,255,' + (.07 + r() * .12) + ')' : 'rgba(90,65,30,' + (.03 + r() * .06) + ')';

}

  var words = text.split(' '), lines = [], cur = '';

    var test = cur ? cur + ' ' + words[i] : words[i];
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[i]; } else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

/* ============================================================

  [89.0, 93.3, 'So they said, \u201CYes! We will help you find your mom!\u201D'],

  [101.0, 109.8, 'The tortoise was very thankful, so they all went and helped the deer find its mother.']
];
var BUB = [
  [34.4, 39.2, 'ele', 'Lion, lion, please come help! A tortoise fell in a crack and can\u2019t come out.'],
  [46.4, 51.2, 'lio', 'Crocodile, crocodile, please come help us! The tortoise fell in a crack and it can\u2019t get out.'],
  [59.4, 63.8, 'cro', 'Baboon, baboon, please come and help! The tortoise fell in a crack and can\u2019t get out.'],
  [78.6, 83.1, 'bab', 'Please help! A tortoise fell in a crack and we can\u2019t get it out!'],
  [83.9, 88.6, 'dee', 'Fine, but only if you help me find my mom.'],
  [89.4, 93.1, 'ele', 'Yes! We will help you find your mom!']

var PW = [[22.4, 26.0], [29.2, 33.8], [42.0, 45.6], [54.0, 58.6], [67.0, 71.0], [95.2, 99.2]];
function heaveAt(t) {
  for (var i = 0; i < PW.length; i++) {
    var a = PW[i][0], b = PW[i][1];
    if (t >= a && t <= b) {
      var env = Math.min(seg(t, a, a + .5), 1 - seg(t, b - .4, b));

function camAt(t) {

    var a = KF[i], b = KF[i + 1];
    if (t >= a[0] && t <= b[0]) {

/* ============================================================
   Room / background
   ============================================================ */
var SCR = { x0: 846, y0: 96, x1: 1234, y1: 504 };
var FLAGS = ['#ef476f', '#ffd166', '#06d6a0', '#4cc9f0', '#f78c6b', '#b388eb'];

function flower(x, y, k) {
  cut(star(x, y, 14, 6, 6, k), '#ecc7a2', { flat: true, noTex: true });
  cut(blob(x, y, 4, 4, k, 6), '#e3b389', { flat: true, noTex: true });
}

  var span = 360;
  for (var x = x0; x < x1; x += span) {
    ctx.strokeStyle = '#6b4a2f'; ctx.lineWidth = 2; ctx.beginPath();
    ctx.moveTo(x, 22); ctx.quadraticCurveTo(x + span / 2, 84, x + span, 22); ctx.stroke();

      var py = (1 - u) * (1 - u) * 22 + 2 * (1 - u) * u * 84 + u * u * 22;

    }

}

  cut(rrect(x, y, 190, 250, 10, 5), '#fffaf0');

  cut(blob(x + 60, y + 70, 22, 22, 3, 10), '#ffe27a', { flat: true });
  cut(blob(x + 120, y + 60, 26, 13, 4, 10), '#ffffff', { flat: true, noTex: true });
  cut(blob(x + 138, y + 66, 18, 10, 5, 10), '#ffffff', { flat: true, noTex: true });
  ctx.fillStyle = '#fffaf0'; ctx.fillRect(x + 90, y + 14, 10, 222); ctx.fillRect(x + 14, y + 120, 162, 10);

}
function plant(x) {
  var greens = ['#4f9d4d', '#62b05a', '#3f8a45'], i;
  for (i = 0; i < 7; i++) {
    var a = -1.2 + i * 0.4;
    cut(blob(x + Math.sin(a) * 40, 515 - Math.cos(a) * 48, 13, 32, i + 1, 10, .05, a), greens[i % 3]);

  eye(31, -117, 3, c.strain); mouth(40, -96, 5, c.mood);
}
function drawDeer(c) {
  var B = c.col || '#d49b5e', BD = c.colD || '#b98048', CR = '#f7e4c0', i;
  cut(blob(-22, -52, 7, 6, 3, 6), '#ffffff');
  var hx = [-8, 8];
  for (i = 0; i < 2; i++) { var st = stepOff(c, i * Math.PI, 11); cut(strip(hx[i], -34, hx[i] + st[0], -6 + st[1], 9), BD); cut(blob(hx[i] + st[0] + 2, -4 + st[1], 6, 4, i + 2, 6), '#4a3426'); }
  cut(blob(0, -58, 24, 36, 41, 12, .03), B);
  cut(blob(8, -54, 13, 26, 42, 8), CR, { noShadow: true, flat: true });
  var spots = [[-10, -70], [-4, -52], [-14, -44], [4, -78], [-8, -60]];
  for (i = 0; i < spots.length; i++) cut(blob(spots[i][0], spots[i][1], 3.2, 3.2, i, 6), '#fff6df', { flat: true, noTex: true });
  cut(strip(10, -84, 22, -104, 16, 13), B);
  cut(blob(12, -126, 8, 15, 45, 8, .05, -.6), B, { rim: 3 });
  cut(blob(12, -126, 4, 10, 46, 8, .05, -.6), '#f2b3b3', { flat: true, noTex: true });
  cut(blob(26, -112, 17, 15, 43, 12), B);
  cut(blob(27, -130, 7, 13, 47, 8, .05, .25), B, { rim: 3 });
  cut(blob(40, -106, 11, 8, 44, 8), CR, { rim: 3 });
  cut(blob(48, -107, 3.5, 3, 1, 6), '#4a3426', { flat: true, noTex: true });
  eye(32, -116, 3.8, c.strain); mouth(42, -100, 3.5, c.mood);
  if (c.mother) { cut(star(17, -134, 8, 3.5, 5, .3), '#ff8fb1', { rim: 2.5, sb: 2 }); cut(blob(17, -134, 2.5, 2.5, 2, 6), '#ffd166', { flat: true, noTex: true }); }

var DRAW = { gir: drawGirl, ele: drawEle, lio: drawLio, cro: drawCro, bab: drawBab, dee: drawDeer, mom: drawDeer };

/* --- arms --- */
function arm(S, Hd, w, col, bend) {
  var dx = Hd[0] - S[0], dy = Hd[1] - S[1], L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  if (ny < 0) { nx = -nx; ny = -ny; }
  var b = Math.min(bend, L * .25), E = [(S[0] + Hd[0]) / 2 + nx * b, (S[1] + Hd[1]) / 2 + ny * b];
  cut(strip(S[0], S[1], E[0], E[1], w, w * .92), col);
  cut(blob(E[0], E[1], w * .5, w * .5, 3, 8, .04), col, { noShadow: true, rim: 3 });
  cut(strip(E[0], E[1], Hd[0], Hd[1], w * .92, w * .8), col);
  cut(blob(Hd[0], Hd[1], w * .62, w * .62, 5, 8, .06), col);
}
function hugBand(prev, col, w, a) {
  var D = CH[prev.id], lxL = -prev.face * D.hw, lxR = prev.face * D.hw * .8;
  var A = pt(prev, lxL - 3, D.wy), B = pt(prev, lerp(lxL, lxR, a), D.wy);
  cut(strip(A[0], A[1], B[0], B[1], w), col);
  return { a: pt(prev, lerp(lxL, lxR, .12), D.wy - 3), b: pt(prev, lerp(lxL, lxR, .32), D.wy + 6) };
}
function chainArms(c, prev, t) {
  var D = CH[c.id];
  if (c.id === 'cro') {
    var Bt = pt(c, -24, -36), idleT = pt(c, -74, -12), T = idleT, a = 0;
    if (c.mode === 'hug' && prev) {
      a = eo(c.hugA);
      var near = hugBand(prev, '#4fae52', 12, a);
      T = L2(idleT, near.a, a);
    }
    var M = [(Bt[0] + T[0]) / 2, (Bt[1] + T[1]) / 2 + 14 * (1 - .5 * a)];
    cut(strip(Bt[0], Bt[1], M[0], M[1], 20, 14), '#4fae52');
    cut(strip(M[0], M[1], T[0], T[1], 14, 8), '#4fae52');
    cut(blob(T[0], T[1], 5, 5, 4, 7), '#3b8f40');
    return;
  }
  var sh = c.sit ? D.shSit : D.sh;
  var S = pt(c, sh[0], sh[1]), S2 = pt(c, sh[0] - 6, sh[1] + 2);
  var sw = Math.sin(c.phase) * 12 * c.amp;
  var HA = pt(c, D.idle[0] + sw, D.idle[1]), HB = pt(c, D.idle[0] - 10 - sw, D.idle[1] + 2);
  if (c.mode === 'bucket') { HA = pt(c, 30, -58); HB = pt(c, 22, -54); }
  else if (c.mode === 'reach') {
    var r = eo(c.reachA); HA = L2(HA, [922, 442], r); HB = L2(HB, [940, 447], r);
  } else if (c.mode === 'hug' && prev) {
    var ha = eo(c.hugA), tg = hugBand(prev, D.armCol, D.armW * .75, ha);
    HA = L2(HA, tg.a, ha); HB = L2(HB, tg.b, ha);
  } else if (c.mode === 'up') {
    var wg = Math.sin(t * 9) * 4, wg2 = Math.cos(t * 9) * 4;
    HA = pt(c, sh[0] + 18 + wg, sh[1] - 62 + wg2); HB = pt(c, sh[0] - 8 - wg, sh[1] - 58 - wg2);
  }

  arm(S2, HB, w, col, bend); arm(S, HA, w, col, bend);
}
function drop(x, y) {
  cut([[x, y - 9], [x + 5, y - 1], [x + 3.5, y + 4], [x, y + 6], [x - 3.5, y + 4], [x - 5, y - 1]], '#6ecbf5', { rim: 2.5, sb: 2 });
}
function floorShadow(c) {
  var wd = (CH[c.id] ? CH[c.id].sw : 34) * c.s * .9;
  var a = c.fly > 0 && c.fly < 1 ? .28 * c.fly : .28 * (1 - c.lift / 70);
  ctx.fillStyle = 'rgba(50,28,10,' + Math.max(0, a) + ')';
  ctx.beginPath(); ctx.ellipse(c.x, FY + 6, wd, 8 * Math.max(.5, c.s), 0, 0, TAU); ctx.fill();
}
function bucketProp(t) {
  if (t < 18.8) return;
  var p = seg(t, 18.8, 19.5), x = lerp(832, 880, p), y = lerp(566, 596, p * p), rot = lerp(0, 1.5, eo(p));
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  cut([[-14, -16], [14, -16], [11, 16], [-11, 16]], '#fffaf0');
  cut([[-8, -16], [-2, -16], [-3, 16], [-6, 16]], '#e63946', { flat: true, noTex: true });
  cut([[4, -16], [10, -16], [8, 16], [5, 16]], '#e63946', { flat: true, noTex: true });
  ctx.restore();
  var i;
  for (i = 0; i < 8; i++) {
    var q = seg(t, 18.9 + i * .03, 19.6), ex = 868 + i * 11 + (i % 2) * 6, ey = 604 + (i % 3) * 5;
    var px = lerp(832, ex, eo(q)), py = lerp(560, ey, q) - 30 * Math.sin(q * Math.PI);
    cut(blob(px, py, 5.5, 5, i + 30, 7), i % 2 ? '#fff3c4' : '#ffe08a', { rim: 2, sb: 2 });
  }
}
function characters(t, h) {
  var ids = ['gir', 'ele', 'lio', 'cro', 'bab', 'dee'], S = {}, i;
  for (i = 0; i < ids.length; i++) S[ids[i]] = charState(t, ids[i], h);
  S.mom = motherState(t);
  var all = ids.concat(['mom']);
  for (i = 0; i < all.length; i++) if (S[all[i]].vis) floorShadow(S[all[i]]);
  for (i = 0; i < ids.length; i++) {
    var c = S[ids[i]]; if (!c.vis) continue;
    withChar(c, DRAW[c.id]);
    chainArms(c, i > 0 ? S[ids[i - 1]] : null, t);
    if (c.id === 'gir') bucketProp(t);
  }
  if (S.mom.vis) { withChar(S.mom, drawDeer); chainArms(S.mom, null, t); }
  return S;
}

/* ============================================================
   Effects and speech bubbles
   ============================================================ */
function burst(x, y, t0, t) {
  var p = (t - t0) / 1.0; if (p < 0 || p > 1) return;
  var cols = ['#ffd23f', '#ff6f91', '#7ae0b6', '#79c7f0', '#fffaf0'], i;
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,' + (1 - p) + ')'; ctx.lineWidth = 6 * (1 - p) + 1;
  ctx.beginPath(); ctx.arc(x, y, 12 + eo(p) * 90, 0, TAU); ctx.stroke(); ctx.restore();
  for (i = 0; i < 10; i++) {
    var a = i / 10 * TAU + hash(i) * .5, r = 16 + eo(p) * (60 + 50 * hash(i + 11));
    cut(star(x + Math.cos(a) * r, y + Math.sin(a) * r, (1 - p) * (10 + 8 * hash(i + 3)) + 2, (1 - p) * 5 + 1, 4, a), cols[i % 5], { rim: 2.5 });
  }
}
function hearts(x, y, t0, t, n) {
  for (var i = 0; i < n; i++) {
    var p = (t - t0 - i * .3) / 2.4; if (p < 0 || p > 1) continue;
    var hx = x + (i - (n - 1) / 2) * 22 + Math.sin(p * 7 + i) * 10, hy = y - p * 110, s = .9 * (.8 + .4 * hash(i + 5));
    ctx.save(); ctx.globalAlpha = 1 - seg(p, .7, 1);
    cut(heartPts(hx, hy, s), ['#ff6f91', '#ff8fb1', '#ff5c8a'][i % 3], { rim: 3 });
    ctx.restore();
  }
}
function bang(x, y, k) {
  ctx.save(); ctx.translate(x, y); var s = bounce(c01(k)); ctx.scale(s, s); ctx.translate(-x, -y);
  cut([[x - 5, y - 30], [x + 5, y - 30], [x + 3, y - 10], [x - 3, y - 10]], '#e63946', { rim: 3 });
  cut(blob(x, y - 3, 4, 4, 2, 8), '#e63946', { rim: 3 });
  ctx.restore();
}
function effects(t, S) {
  var id, i;
  for (id in JUMP) burst(1040, 330, JUMP[id][0], t);
  burst(930, 430, 99.3, t); burst(930, 430, 99.5, t);
  if (t >= 20 && t < 22.4) {
    ctx.save();
    for (i = 0; i < 3; i++) {
      var ph = ((t * 2.2 + i / 3) % 1);
      ctx.strokeStyle = 'rgba(255,255,255,' + (1 - ph) * .9 + ')'; ctx.lineWidth = 4 * (1 - ph) + 1;
      ctx.beginPath(); ctx.ellipse(930, 444, 14 + ph * 34, 8 + ph * 18, 0, 0, TAU); ctx.stroke();
    }
    ctx.restore();
  }
  var g = S.gir;
  if (t >= 14.3 && t < 15.5) { var hg = pt(g, 4, -140 + 34); bang(hg[0], hg[1] - 10, (t - 14.3) / .3); }
  if (t >= 78 && t < 79.3) {
    var ids = ['gir', 'ele', 'lio', 'cro', 'bab'];
    for (i = 0; i < ids.length; i++) if (S[ids[i]].vis) { var hd = pt(S[ids[i]], CH[ids[i]].head[0], CH[ids[i]].head[1]); bang(hd[0], hd[1] - 8, (t - 78) / .3); }
  }
  // sweat
  var all = ['gir', 'ele', 'lio', 'cro', 'bab', 'dee'];
  for (i = 0; i < all.length; i++) {
    var c = S[all[i]];
    if (c.vis && c.strain) {
      var hp = pt(c, CH[c.id].head[0] - 16, CH[c.id].head[1] + 40);
      drop(hp[0] - 6, hp[1] + (F % 4) * 4);
    }
  }
  hearts(1060, 380, 100.7, t, 5);
  hearts(-265, 430, 107.3, t, 7);
}
function drawBubble(x, y, text, k, cam) {
  ctx.save(); ctx.font = '600 22px ' + FONT;
  var lines = wrapText(text, 300), mw = 0, i;
  for (i = 0; i < lines.length; i++) mw = Math.max(mw, ctx.measureText(lines[i]).width);
  var bw = mw + 40, bh = lines.length * 28 + 26;
  var left = cam.x - 640 / cam.z + 14, right = cam.x + 640 / cam.z - 14;
  var bx = Math.max(left, Math.min(right - bw, x - bw / 2)), by = y - bh - 36;
  var sp = eo(Math.max(.001, k)); ctx.translate(x, y); ctx.scale(sp, sp); ctx.translate(-x, -y);
  ctx.globalAlpha = Math.min(1, k * 1.5);
  var tx = Math.max(bx + 26, Math.min(bx + bw - 26, x));
  cut([[tx - 12, by + bh - 4], [tx + 12, by + bh - 4], [x, y - 4]], '#fffdf4');
  cut(rrect(bx, by, bw, bh, 18, 3), '#fffdf4');
  ctx.fillStyle = '#3a2a1c'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (i = 0; i < lines.length; i++) ctx.fillText(lines[i], bx + bw / 2, by + 27 + i * 28);
  ctx.restore();
}
function bubbles(t, cam, S) {
  for (var i = 0; i < BUB.length; i++) {
    var b = BUB[i]; if (t < b[0] || t > b[1]) continue;
    var c = S[b[2]]; if (!c || !c.vis) continue;
    var A = pt(c, CH[b[2]].head[0], CH[b[2]].head[1]);
    var k = Math.min(seg(t, b[0], b[0] + .3), 1 - seg(t, b[1] - .25, b[1]));
    drawBubble(A[0], A[1] - 6, b[3], k, cam);
  }
}

/* ============================================================
   Title + captions (screen space)
   ============================================================ */
function title(t) {
  if (t > 4.8) return;
  var lines = ['The Tortoise', 'in the Movie'], pal = ['#ff8fa3', '#ffd166', '#7ae0b6', '#79c7f0', '#ffb27a', '#c3a3f5'];
  var idx = 0, li, ci;
  ctx.save(); ctx.font = '700 44px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (li = 0; li < lines.length; li++) {
    var s = lines[li], step = 74, tx0 = 640 - (s.length - 1) * step / 2, ty = 215 + li * 100;
    for (ci = 0; ci < s.length; ci++) {
      var ch = s.charAt(ci); idx++;
      if (ch === ' ') continue;
      var st = .25 + idx * .1, p = seg(t, st, st + .6);
      if (p <= 0) continue;
      var ex = seg(t, 3.8 + idx * .02, 4.6), y = ty - (1 - bounce(p)) * 600 - 900 * ex * ex;
      var rot = (hash(idx * 3) - .5) * .18 + ex * (hash(idx) - .5) * 2;
      ctx.save(); ctx.translate(tx0 + ci * step, y); ctx.rotate(rot);
      cut(rrect(-33, -37, 66, 74, 10, idx), pal[idx % pal.length]);
      ctx.fillStyle = '#2b1d12'; ctx.fillText(ch, 0, 3);
      ctx.restore();
    }
  }
  ctx.restore();
}
function caption(t) {
  var cur = null, idx = -1, i;
  for (i = 0; i < CAPS.length; i++) if (t >= CAPS[i][0] && t <= CAPS[i][1]) { cur = CAPS[i]; idx = i; }
  if (!cur) return;
  var a = Math.min(seg(t, cur[0], cur[0] + .35), 1 - seg(t, cur[1] - .3, cur[1]));
  ctx.save();
  var size = 28, lines;
  for (;;) {
    ctx.font = '600 ' + size + 'px ' + FONT; lines = wrapText(cur[2], 1080);
    if (lines.length <= 2 || size <= 20) break; size -= 2;
  }
  var lh = size * 1.3, mw = 0;
  for (i = 0; i < lines.length; i++) mw = Math.max(mw, ctx.measureText(lines[i]).width);
  var bw = mw + 64, bh = lines.length * lh + 30, cy = 704 - bh / 2 + (1 - a) * 16;
  ctx.globalAlpha = a; ctx.translate(640, cy); ctx.rotate(-.004);
  cut(rrect(-bw / 2, -bh / 2, bw, bh, 16, idx + 2), '#fff6df');
  ctx.fillStyle = '#3a2a1c'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (i = 0; i < lines.length; i++) ctx.fillText(lines[i], 0, -bh / 2 + 15 + lh / 2 + i * lh);
  ctx.restore();
}

/* ============================================================
   Render + playback
   ============================================================ */
function render(t) {
  F = Math.round(t * FPS); SC = cv.width / W;
  ctx.setTransform(SC, 0, 0, SC, 0, 0); ctx.clearRect(0, 0, W, H);
  var cam = camAt(t); SHS = SC * cam.z;
  var h = heaveAt(t);
  ctx.save(); ctx.translate(640, 360); ctx.scale(cam.z, cam.z); ctx.translate(-cam.x, -cam.y);
  room(); movie(t, h); curtains(t);
  var S = characters(t, h);
  flash(t); frameFront(); effects(t, S); bubbles(t, cam, S);
  ctx.restore();
  SHS = SC; title(t); caption(t);
}

var T = 0, last = null, playing = true, lastFrame = -1;
function resize() {
  var dpr = Math.min(window.devicePixelRatio || 1, 2), K = Math.min(window.innerWidth / W, window.innerHeight / H);
  var cw = Math.max(320, Math.floor(W * K)), ch = Math.floor(cw * H / W);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.width = Math.floor(cw * dpr); cv.height = Math.floor(ch * dpr);
  PAPER = makePaper(); lastFrame = -1;
}
function loop(now) {
  if (last === null) last = now;
  var dt = (now - last) / 1000; last = now; if (dt > .1) dt = .1;
  if (playing) { T += dt; if (T >= END) { T = END; playing = false; wrapEl.classList.add('show'); lastFrame = -1; } }
  var f = Math.floor(T * FPS);
  if (f !== lastFrame) { lastFrame = f; render(f / FPS); }
  requestAnimationFrame(loop);
}
function restart() { wrapEl.classList.remove('show'); T = 0; last = null; playing = true; lastFrame = -1; }
btn.addEventListener('click', restart);
window.addEventListener('resize', resize);
resize();
window.__seek = function (tt) { playing = false; T = tt; lastFrame = -1; render(Math.round(tt * FPS) / FPS); };
requestAnimationFrame(loop);
})();
</script>
