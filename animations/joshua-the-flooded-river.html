<script>
(function () {
'use strict';

/* ============================================================
   THE FLOODED RIVER - a paper cut-out animation
   Everything on screen is drawn by JavaScript.
   ============================================================ */

var W = 1280, H = 720, STAGE = 610, G = 1.15;
var FONT = '"Chalkboard SE","Comic Sans MS","Segoe Print","Marker Felt","Trebuchet MS",sans-serif';
var OFF = 1420;
var END_T = 92;

/* ---------- page + canvas (all created from JS) ---------- */
document.documentElement.style.cssText = 'height:100%;';
document.body.style.cssText = 'margin:0;height:100%;background:#3b2f2a;overflow:hidden;display:flex;align-items:center;justify-content:center;';
var wrap = document.createElement('div');
wrap.style.cssText = 'position:relative;';
var cv = document.createElement('canvas');
cv.style.display = 'block';
wrap.appendChild(cv);
document.body.appendChild(wrap);
var ctx = cv.getContext('2d');
var g = ctx;
var SC = 1, cw = W, ch = H;

/* ---------- small helpers ---------- */
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function ease(u) { return u * u * (3 - 2 * u); }
function lerp(a, b, u) { return a + (b - a) * u; }
function hash(a, b) { var x = Math.sin(a * 127.1 + b * 311.7 + 1.7) * 43758.5453; return x - Math.floor(x); }
function hex2rgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function mix(c1, c2, u) {
  var a = hex2rgb(c1), b = hex2rgb(c2);
  return 'rgb(' + [0, 1, 2].map(function (i) { return Math.round(lerp(a[i], b[i], u)); }).join(',') + ')';
}
function bounceOut(x) {
  var n1 = 7.5625, d1 = 2.75;
  if (x < 1 / d1) return n1 * x * x;
  if (x < 2 / d1) { x -= 1.5 / d1; return n1 * x * x + 0.75; }
  if (x < 2.5 / d1) { x -= 2.25 / d1; return n1 * x * x + 0.9375; }
  x -= 2.625 / d1; return n1 * x * x + 0.984375;
}
function psc(y) { return Math.max(0.45, Math.min(1.05, 0.5 + (y - 420) / 190 * 0.4)) * G; }

/* ---------- paper-cut drawing ---------- */
var sid = 0, boil = 0;
function seed(n) { sid = n * 997; }
function ell(cx, cy, rx, ry, n) {
  n = n || 14; var p = [];
  for (var i = 0; i < n; i++) { var a = i / n * Math.PI * 2; p.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); }
  return p;
}
function box(x, y, w, h) { return [[x, y], [x + w, y], [x + w, y + h], [x, y + h]]; }
function cut(pts, fill, o) {
  o = o || {};
  var id = ++sid, i, n = pts.length;
  var minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
  for (i = 0; i < n; i++) {
    if (pts[i][0] < minx) minx = pts[i][0]; if (pts[i][0] > maxx) maxx = pts[i][0];
    if (pts[i][1] < miny) miny = pts[i][1]; if (pts[i][1] > maxy) maxy = pts[i][1];
  }
  var ext = Math.max(maxx - minx, maxy - miny);
  var jj = o.j !== undefined ? o.j : Math.min(2.4, ext * 0.06);
  var bb = Math.min(0.9, ext * 0.03);
  g.beginPath();
  for (i = 0; i < n; i++) {
    var x = pts[i][0] + (hash(id, i * 2) - 0.5) * jj + (hash(id + boil * 13, i * 2 + 5) - 0.5) * bb;
    var y = pts[i][1] + (hash(id, i * 2 + 1) - 0.5) * jj + (hash(id + boil * 13, i * 2 + 6) - 0.5) * bb;
    if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
  }
  g.closePath();
  g.fillStyle = fill;
  if (o.noShadow) { g.shadowColor = 'transparent'; }
  else {
    g.shadowColor = 'rgba(45,30,20,0.36)';
    g.shadowBlur = 3.5 * SC; g.shadowOffsetX = 2 * SC; g.shadowOffsetY = 3 * SC;
  }
  g.fill();
  g.shadowColor = 'transparent';
  if (!o.noEdge && ext >= 9) {

  }
}
function leg(x, y, len, w, ang, col, shoe) {
  g.save(); g.translate(x, y); g.rotate(ang);
  cut(box(-w / 2, 0, w, len), col);
  if (shoe) cut([[-w / 2 - 1, len - 5], [w / 2 + 8, len - 4], [w / 2 + 8, len + 2], [-w / 2 - 1, len + 2]], shoe);
  g.restore();
}
function arm(x, y, len, w, ang, col, hand) {
  g.save(); g.translate(x, y); g.rotate(ang);
  cut(box(-w / 2, 0, w, len), col);
  cut(ell(0, len + 1, w * 0.7, w * 0.7, 8), hand);
  g.restore();
}

/* ---------- characters (feet at 0,0, facing right) ---------- */
function peopleArms(s) {
  var t = s.t, w;
  if (s.mv) { var sw = Math.sin(s.ph) * 0.7; return [sw, -sw]; }
  switch (s.pose) {
    case 'call': return [0.12, -2.35 + Math.sin(t * 9) * 0.12];
    case 'cheer': w = Math.sin(t * 7) * 0.25; return [2.7 + w, -2.7 - w];
    case 'worry': w = Math.sin(t * 10) * 0.05; return [0.35 + w, -0.35 - w];
    default: w = Math.sin(t * 1.8) * 0.03; return [0.08 + w, -0.08 - w];
  }
}

function drawMan(s) {

  cut([[-16, -60], [16, -60], [16, -38], [-16, -38]], ov);
  cut([[-10, -84 + br], [-5, -84 + br], [-3, -60], [-12, -60]], ov);
  cut([[5, -84 + br], [10, -84 + br], [12, -60], [3, -60]], ov);
  g.save(); g.translate(0, br);
  if (s.pose === 'worry' && !s.mv) g.rotate(Math.sin(s.t * 3) * 0.05);
  cut(ell(-12, -97, 5, 7, 8), '#f4f4f4'); cut(ell(12, -97, 5, 7, 8), '#f4f4f4');
  cut(ell(0, -96, 13, 14, 14), skin);
  cut(ell(0, -108, 13, 6, 12), '#8a6140');
  cut([[6, -107], [21, -104], [20, -100], [6, -102]], '#7a5535');
  cut(ell(6, -98, 1.8, 2.2, 6), '#2a2a2a');
  cut(ell(11, -94, 3, 3, 6), '#e7ac86');
  cut([[3, -90], [15, -91], [14, -87], [3, -86]], '#f4f4f4');
  if (s.pose === 'call') cut(ell(9, -83.5, 3.4, 3.4, 8), '#7a2f2f');
  if (s.pose === 'worry' && !s.mv && Math.sin(s.t * 3) > 0.2) cut([[17, -114], [21, -107], [17, -103], [13, -107]], '#6cc3e8');

}

function drawWoman(s) {

  var a = peopleArms(s), skin = '#f1c8a1', dress = '#c9507d', apron = '#f7ead0';

}

function dogHead() {
  cut(ell(0, 0, 13, 12, 14), '#a8693a');

}

function drawDog(s) {
  var P = s.pose, brown = '#a8693a', dark = '#6b3f22', cream = '#f4e7d0';
  if (P === 'sit') {
    var shake = s.shake ? Math.sin(s.t * 16) * 0.3 : 0, wag = Math.sin(s.t * 6) * 0.25;
    g.save(); g.translate(-22, -4); g.rotate(wag * 0.3);
    cut([[0, 0], [-22, -4], [-24, 2], [0, 5]], brown); g.restore();
    cut(ell(-10, -10, 17, 11, 12), brown);
    g.save(); g.translate(-4, -6); g.rotate(0.22);
    cut(ell(0, -26, 14, 28, 14), brown);
    cut(ell(5, -22, 7, 17, 10), cream);
    cut(box(5, -28, 6, 26), brown);
    cut(ell(8, -2, 7, 3.5, 8), cream);
    g.save(); g.translate(2, -56); g.rotate(shake); dogHead(); g.restore();
    g.restore();
    return;
  }
  if (P === 'swim') {
    var bob = Math.sin(s.t * 7) * 1.5;
    g.save(); g.translate(0, bob);
    g.save(); g.translate(-26, -26); g.rotate(-0.8 + Math.sin(s.t * 8) * 0.2);
    cut([[0, 0], [-14, -8], [-16, -2], [0, 5]], brown); g.restore();
    cut(ell(-2, -22, 26, 11, 14), brown);
    g.save(); g.translate(26, -36); dogHead(); g.restore();
    cut([[-46, -12], [-30, -16], [-12, -12], [6, -16], [24, -12], [44, -15], [48, 8], [-48, 8]], s.water);
    cut(ell(-32, -14, 10, 2.5, 10), '#eaf8fb', { noEdge: true });
    cut(ell(34, -14, 12, 2.5, 10), '#eaf8fb', { noEdge: true });
    g.restore();

  var wag2 = Math.sin(s.t * (s.mv ? 14 : 8)) * 0.45;
  leg(-18, -20, 20, 7, sw, dark); leg(14, -20, 20, 7, -sw, dark);
  g.save(); g.translate(-27, -36); g.rotate(-0.7 + wag2 * 0.5);
  cut([[0, 0], [-20, -7], [-22, -1], [0, 6]], brown); g.restore();
  cut(ell(0, -31, 28, 15, 14), brown);
  cut(ell(3, -25, 17, 7, 10), cream);
  cut(ell(-9, -38, 9, 6, 8), dark);
  leg(-11, -20, 20, 7, -sw, brown); leg(20, -20, 20, 7, sw, brown);
  g.save(); g.translate(30, -45); g.rotate(Math.sin(s.t * 3) * 0.05 + (P === 'leap' ? -0.25 : 0)); dogHead(); g.restore();

function drawSheep(s) {

  leg(-16, -18, 18, 6, sw, dark); leg(14, -18, 18, 6, -sw, dark);

  cut([[-4, -6], [-15, -1], [-5, 3]], dark);

function drawCow(s) {

function drawPig(s) {
  var sw = s.mv ? Math.sin(s.ph * 1.4) * 0.6 : 0, pk = '#f4adbd', dk = '#e58aa0';
  leg(-18, -16, 16, 8, sw, dk); leg(14, -16, 16, 8, -sw, dk);
  g.save(); g.translate(-32, -34); g.rotate(Math.sin(s.t * 8) * 0.2);

  cut(ell(4, -4, 2.1, 2.5, 6), '#222');
  g.restore();
}

function drawHen(s) {
  var sw = s.mv ? Math.sin(s.ph * 1.5) * 0.5 : 0, body = '#d98b3f', wing = '#c26f2c';
  leg(-3, -14, 14, 3, sw, '#e7b13d'); leg(5, -14, 14, 3, -sw, '#e7b13d');
  cut([[-12, -30], [-27, -48], [-20, -24]], '#a85a22');
  cut([[-14, -26], [-31, -38], [-18, -18]], wing);

  g.save(); g.translate(13, -36); g.rotate(pk);

  cut(ell(-1, -14, 3, 3, 6), '#e03a3a'); cut(ell(3, -14, 3, 3, 6), '#e03a3a');

function drawDuck(s) {

    cut([[-16, -2], [-27, -7], [-17, 4]], y);

  var body = '#9b6235', mane = '#2d1d12';
  var a = s.mv ? Math.sin(s.ph * 1.1) : 0;
  leg(-36, -64, 64, 10, a * 0.9, '#7e4d29', '#2a2a2a');
  leg(32, -64, 64, 10, -a * 0.9, '#7e4d29', '#2a2a2a');

  cut(ell(80, -134, 2.1, 2.3, 6), '#111');

function drawAnt(s) {
  var c = '#4a2a27', c2 = '#6b3a30', sw = s.mv ? Math.sin(s.ph * 1.6) : 0, boo = s.pose === 'boo', i;
  g.save();
  if (boo) g.rotate(-0.3);
  for (i = 0; i < 3; i++) {
    var d = sw * (i % 2 ? 1 : -1) * 0.5;
    leg(-9 + i * 8, -14, 14, 2.4, 0.35 + d, c);
    leg(-9 + i * 8, -14, 14, 2.4, -0.35 - d, c);

  g.save(); g.translate(-2, -20); g.rotate(fl);
  cut([[0, -2], [-20, -6], [-24, 8], [-2, 4]], '#d93636'); g.restore();
  cut(ell(-17, -18, 12, 9, 10), c);
  cut(ell(0, -17, 7, 6, 8), c2);
  cut(ell(13, -22, 8, 8, 10), c);
  cut([[16, -28], [22, -41], [24, -40], [18, -27]], c);
  cut([[11, -29], [12, -42], [14, -41], [14, -28]], c);
  cut(ell(16, -23, 3, 3.2, 8), '#ffffff');
  cut(ell(17, -23, 1.4, 1.4, 6), '#111');
  if (boo) {
    cut(ell(18, -17, 3.2, 3.2, 8), '#c03a3a');
    cut([[8, -18], [21, -35], [24, -32], [11, -15]], c);
  } else {
    cut([[15, -18], [21, -18], [18, -15]], '#ffffff');
  }
  g.restore();
}

  for (var i = 0; i < BUBBLES.length; i++) {
    var b = BUBBLES[i];
    if (T < b.t0 || T > b.t1) continue;
    var a = b.a;
    if (!a.visible(T)) continue;
    var p = a.pos(T);
    if (p[0] > W + 40 || p[0] < -40) continue;
    var u = clamp((T - b.t0) / 0.22, 0, 1), c1 = 1.70158, c3 = c1 + 1;
    var sc = 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2);
    var fade = clamp((b.t1 - T) / 0.2, 0, 1);
    var x = clamp(p[0], 90, W - 90), y = p[1] - TOPH[a.type] * psc(p[1]) * a.size - 12;
    if (b.style === 'excl') y -= Math.abs(Math.sin(T * 14)) * 4;
    g.save(); g.globalAlpha = fade; g.translate(x, y); g.scale(sc, sc);
    seed(2000 + i * 3);
    var fs = b.style === 'shout' ? 44 : (b.style === 'excl' ? 30 : 28);
    g.font = 'bold ' + fs + 'px ' + FONT;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    var tw = g.measureText(b.text).width, bw = tw + 36, bh = fs + 18, n, k;
    if (b.style === 'excl') {
      cut([[-6, -6], [6, -6], [1, 10]], '#e63946');
      cut(ell(0, -17, 17, 17, 14), '#e63946');
      g.fillStyle = '#ffffff'; g.fillText('!', 0, -15);
    } else if (b.style === 'shout') {
      var pts = [];
      for (k = 0; k < 20; k++) {
        var ang = k / 20 * Math.PI * 2, rr = k % 2 ? 0.62 : 1;
        pts.push([Math.cos(ang) * (bw / 2 + 24) * rr, -bh / 2 - 6 + Math.sin(ang) * (bh / 2 + 22) * rr]);
      }
      cut(pts, '#ffe066');
      g.fillStyle = '#c1121f'; g.fillText(b.text, 0, -bh / 2 - 4);
    } else if (b.style === 'think') {
      cut(ell(-6, 8, 4, 4, 8), '#fffdf2'); cut(ell(-2, 0, 6, 6, 8), '#fffdf2');
      cut(ell(0, -bh / 2 - 8, bw / 2, bh / 2, 18), '#fffdf2');
      g.fillStyle = '#3a2a20'; g.fillText(b.text, 0, -bh / 2 - 6);
    } else {
      cut([[-9, -8], [9, -8], [2, 12]], '#fffdf2');
      cut(ell(0, -bh / 2, bw / 2, bh / 2, 18), '#fffdf2');
      g.fillStyle = b.col || '#3a2a20'; g.fillText(b.text, 0, -bh / 2 + 2);
    }
    g.restore();
  }
}

/* ---------- title letters, caption panel ---------- */
function drawLetters(str, cx, cy, size, t0, T, alpha) {
  var pal = ['#e4572e', '#f3a712', '#29a0b1', '#6aa84f', '#a45dbf', '#e85d9a'];
  var gap = size * 1.06, sp = size * 0.55, total = 0, i, x;
  for (i = 0; i < str.length; i++) total += str[i] === ' ' ? sp : gap;
  x = cx - total / 2;
  for (i = 0; i < str.length; i++) {
    var ch = str[i];
    if (ch === ' ') { x += sp; continue; }
    var u = clamp((T - t0 - 0.06 * i) / 0.6, 0, 1);
    if (u > 0) {
      var y = cy - (1 - bounceOut(u)) * 420;
      g.save(); g.globalAlpha = alpha; g.translate(x + gap / 2, y); g.rotate((hash(i, 9) - 0.5) * 0.22);
      seed(3000 + i);
      cut(box(-size / 2, -size / 2, size, size), pal[i % pal.length]);
      g.fillStyle = '#fffaf0'; g.font = 'bold ' + (size * 0.72) + 'px ' + FONT;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(ch, 0, size * 0.04);
      g.restore();
    }
    x += gap;
  }
}
function wrapLines(words, maxW, font) {
  g.font = font;
  var lines = [], cur = [];
  for (var i = 0; i < words.length; i++) {
    var test = cur.concat([words[i]]).join(' ');
    if (g.measureText(test).width > maxW && cur.length) { lines.push(cur); cur = [words[i]]; }
    else cur.push(words[i]);
  }
  if (cur.length) lines.push(cur);
  return lines;
}
function drawPanel(T) {
  var i;
  var grd = g.createLinearGradient(0, STAGE - 10, 0, STAGE + 2);
  grd.addColorStop(0, 'rgba(0,0,0,0)'); grd.addColorStop(1, 'rgba(0,0,0,0.28)');
  g.fillStyle = grd; g.fillRect(0, STAGE - 10, W, 12);
  g.fillStyle = '#b98a58'; g.fillRect(0, STAGE, W, H - STAGE);
  seed(4000);
  var zz = [];
  for (i = 0; i <= 32; i++) zz.push([i * 40, STAGE + 3 + (i % 2 ? 3 : -2)]);
  zz.push([W, H + 5]); zz.push([0, H + 5]);
  cut(zz, '#d6ad7b');
  var slide = (1 - ease(clamp((T - 3.4) / 0.5, 0, 1))) * 130;
  g.save(); g.translate(W / 2, STAGE + 56 + slide); g.rotate(-0.004);
  seed(4100);
  cut(box(-592, -42, 1184, 84), '#fff8e6');
  cut([[-606, -50], [-562, -54], [-558, -38], [-602, -34]], 'rgba(255,205,90,0.82)', { noEdge: true, noShadow: true, j: 0.6 });
  cut([[606, -50], [562, -54], [558, -38], [602, -34]], 'rgba(255,205,90,0.82)', { noEdge: true, noShadow: true, j: 0.6 });
  var cap = null;
  for (i = 0; i < CAPS.length; i++) if (CAPS[i][0] <= T) cap = CAPS[i];
  if (cap) {
    if (!cap.lines) {
      cap.fs = 30; cap.lines = wrapLines(cap.words, 1110, '600 30px ' + FONT);
      if (cap.lines.length > 2) { cap.fs = 26; cap.lines = wrapLines(cap.words, 1110, '600 26px ' + FONT); }
    }
    var nW = cap.words.length, dur = Math.min(cap[1] - cap[0], 12) * 0.5;
    var shown = Math.ceil(clamp((T - cap[0]) / dur, 0, 1) * nW);
    g.font = '600 ' + cap.fs + 'px ' + FONT;
    g.fillStyle = '#3a2a20'; g.textBaseline = 'middle'; g.textAlign = 'left';
    var lh = cap.fs * 1.2, y0 = -(cap.lines.length - 1) * lh / 2, idx = 0;
    for (var li = 0; li < cap.lines.length; li++) {
      var line = cap.lines[li], lw = g.measureText(line.join(' ')).width, x = -lw / 2;
      for (var wi = 0; wi < line.length; wi++) {
        if (idx < shown) g.fillText(line[wi], x, y0 + li * lh + 2);
        x += g.measureText(line[wi] + ' ').width; idx++;
      }
    }
  }
  g.restore();
}
function drawConfetti(T) {
  if (T < 86) return;
  var cols = ['#e4572e', '#f3a712', '#29a0b1', '#6aa84f', '#a45dbf', '#e85d9a'];
  for (var k = 0; k < 40; k++) {
    var y = -20 - hash(k, 3) * 320 + (T - 86) * (70 + hash(k, 4) * 70);
    if (y > STAGE + 10) continue;
    var x = hash(k, 1) * W + Math.sin(T * 2 + k) * 20;
    g.save(); g.translate(x, y); g.rotate(T * (hash(k, 5) - 0.5) * 6 + k);
    seed(3500 + k);
    cut(box(-6, -4, 12, 8), cols[k % cols.length], { j: 0.8 });
    g.restore();
  }
}

/* ---------- paper texture ---------- */
var noiseCv = document.createElement('canvas');
noiseCv.width = noiseCv.height = 256;
var noisePat = null;
(function () {
  var nx = noiseCv.getContext('2d'), id = nx.createImageData(256, 256), d = id.data, i;
  for (i = 0; i < d.length; i += 4) { var v = 228 + Math.random() * 27; d[i] = v; d[i + 1] = v - 2; d[i + 2] = v - 6; d[i + 3] = 255; }
  nx.putImageData(id, 0, 0);
  nx.lineWidth = 1;
  for (i = 0; i < 260; i++) {
    nx.strokeStyle = 'rgba(190,178,150,0.22)'; nx.beginPath();
    var x = Math.random() * 256, y = Math.random() * 256;
    nx.moveTo(x, y); nx.lineTo(x + (Math.random() - 0.5) * 14, y + (Math.random() - 0.5) * 14); nx.stroke();
  }
  noisePat = ctx.createPattern(noiseCv, 'repeat');
})();

/* ---------- main render ---------- */
function render(T) {
  boil = Math.floor(T * 8);
  g = ctx;
  ctx.setTransform(SC, 0, 0, SC, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.shadowColor = 'transparent';
  var dawn = ease(clamp(T / 12, 0, 1));
  g.fillStyle = mix('#f4b88f', '#a9dbea', dawn);
  g.fillRect(0, 0, W, STAGE);
  seed(10);
  cut(wavy(-20, W + 20, 170, 10, 0.008, 1, 430), mix('#fbd9b8', '#c4e9f3', dawn));
  drawSun(T);
  drawCloud(((120 + T * 9) % (W + 300)) - 150, 80, 1.0, 1);
  drawCloud(((560 + T * 6) % (W + 300)) - 150, 135, 0.8, 2);
  drawCloud(((930 + T * 11) % (W + 300)) - 150, 62, 1.2, 3);
  g.drawImage(cGround, 0, 0, W, H);
  drawSmoke(T);
  drawRiver(T);
  var list = ACTORS.filter(function (a) { return a.visible(T); });
  list.sort(function (a, b) { return a.pos(T)[1] - b.pos(T)[1]; });
  for (var i = 0; i < list.length; i++) drawActor(list[i], T);
  g.drawImage(cFg, 0, 0, W, H);
  drawConfetti(T);
  drawBubbles(T);
  /* title */
  if (T < 4.8) {
    var ta = 1 - clamp((T - 3.6) / 0.9, 0, 1);
    drawLetters('The Flooded River', 640, 200, 62, 0.3, T, ta);
    if (T > 1.8) {
      g.save(); g.globalAlpha = ta * clamp((T - 1.8) / 0.4, 0, 1);
      g.translate(640, 272); g.rotate(-0.02); seed(3600);
      cut(box(-190, -22, 380, 44), '#fffaf0');
      g.fillStyle = '#3a2a20'; g.font = 'bold 26px ' + FONT; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText('a cumulative story', 0, 2);
      g.restore();
    }
  }
  /* the end */
  if (T > 89.2) drawLetters('The End', 640, 215, 80, 89.2, T, 1);
  drawPanel(T);
  g.save();
  g.globalCompositeOperation = 'multiply'; g.globalAlpha = 0.85;
  g.fillStyle = noisePat; g.fillRect(0, 0, W, H);
  g.restore();
}

/* ---------- replay button ---------- */
var btn = document.createElement('button');
btn.textContent = '\u21BB Replay';
btn.style.cssText = 'position:absolute;left:50%;top:47%;transform:translate(-50%,-50%) rotate(-2deg) scale(0);opacity:0;display:none;border:none;cursor:pointer;background:#fff8e6;color:#3a2a20;font-family:' + FONT + ';font-weight:bold;padding:0.45em 1.1em;border-radius:6px;box-shadow:6px 6px 0 #e4572e,9px 11px 12px rgba(0,0,0,0.35);transition:transform .45s cubic-bezier(.3,1.6,.5,1),opacity .3s;';
wrap.appendChild(btn);
var btnShown = false;
function showBtn() {
  btnShown = true; btn.style.display = 'block';
  void btn.offsetWidth;
  btn.style.opacity = '1';
  btn.style.transform = 'translate(-50%,-50%) rotate(-2deg) scale(1)';
}
function hideBtn() {
  btnShown = false; btn.style.opacity = '0'; btn.style.display = 'none';
  btn.style.transform = 'translate(-50%,-50%) rotate(-2deg) scale(0)';
}
btn.addEventListener('mouseenter', function () { btn.style.transform = 'translate(-50%,-50%) rotate(-2deg) scale(1.07)'; });
btn.addEventListener('mouseleave', function () { btn.style.transform = 'translate(-50%,-50%) rotate(-2deg) scale(1)'; });

/* ---------- sizing + loop ---------- */
function fit() {
  var k = Math.min(innerWidth / W, innerHeight / H);
  cw = Math.max(200, Math.floor(W * k)); ch = Math.floor(H * k);
  var dpr = Math.min(window.devicePixelRatio || 1, 1.75);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  wrap.style.width = cw + 'px'; wrap.style.height = ch + 'px';
  cv.width = Math.floor(cw * dpr); cv.height = Math.floor(ch * dpr);
  SC = cv.width / W;
  btn.style.fontSize = Math.round(30 * cw / W) + 'px';
  buildCache();
}
var T = 0, last = performance.now();
function restart() {
  T = 0; last = performance.now();
  ACTORS.forEach(function (a) { a.face = 1; });
  hideBtn();
}
btn.addEventListener('click', restart);
window.addEventListener('resize', fit);
function loop(now) {
  var dt = Math.min((now - last) / 1000, 0.1); last = now;
  T += dt;
  render(T);
  if (T >= END_T && !btnShown) showBtn();
  requestAnimationFrame(loop);
}
fit();
requestAnimationFrame(function (now) { last = now; loop(now); });
})();
</script>
