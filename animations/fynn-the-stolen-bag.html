<style>

</style></head>
<body><div id="stage"><svg id="svg" viewBox="0 0 960 540" role="img" aria-label="Animated paper cut-out story: The Stolen Bag"></svg><button id="replay">&#8635; Replay</button></div>
<script>
const E='#fffdf5',svg=document.getElementById('svg'),btn=document.getElementById('replay');
const A=`stroke="${E}" stroke-width="5" stroke-linejoin="round" paint-order="stroke"`;
const sh=(d,f,x='')=>`<path d="${d}" fill="${f}" ${A} ${x}/>`;

const el=(x,y,a,b,f,x2='')=>`<ellipse cx="${x}" cy="${y}" rx="${a}" ry="${b}" fill="${f}" ${A} ${x2}/>`;
const dot=(x,y,r=2.6,f='#2b2118')=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}"/>`;
const ln=(d,w=2.5,c='#2b2118')=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
const G=(id,i,x='')=>`<g id="${id}" ${x}>${i}</g>`;
const DS='filter="url(#ds)"';

/* ---------- scenery ---------- */
const pine=(x,y,s)=>`<g transform="translate(${x} ${y}) scale(${s})">${rc(-7,-30,14,32,'#8a5a3b')+sh('M-38 -28L0 -92L38 -28Z','#3b9060')+sh('M-32 -60L0 -120L32 -60Z','#2f7d4f')}</g>`;
let L=sh('M-20 340Q120 250 260 320T520 300T800 310T980 290L980 360L-20 360Z','#9ccf8e')+sh('M-20 360Q200 290 420 345T760 335T980 340L980 400L-20 400Z','#7fbf72');
L+=pine(30,352,1)+pine(890,350,1.2)+pine(940,354,.8)+`<g transform="translate(630 352)">${rc(-8,-60,16,64,'#8a5a3b')+ci(-28,-62,30,'#4da35a')+ci(28,-62,30,'#4da35a')+ci(0,-88,38,'#5cb56a')}</g>`;
L+=sh('M-20 375Q300 350 520 372T980 365L980 560L-20 560Z','#9bd886')+sh('M-20 436Q300 418 600 436T980 426L980 456Q600 462 300 452T-20 462Z','#ecd9a8');
for(let i=0;i<18;i++){const x=(i*83+40)%930+15,y=372+(i*47)%52,c=['#f28e9b','#fff','#f4b942','#c77dff'][i%4];L+=[0,1,2,3,4].map(k=>ci(x+Math.cos(k*1.257)*5,y+Math.sin(k*1.257)*5,3.5,c)).join('')+ci(x,y,3,'#f7c948')}
L+=el(462,436,26,8,'#7a5230')+sh('M452 434L448 414L458 428Z','#4caf50')+sh('M462 434L462 410L468 432Z','#4caf50')+sh('M472 434L478 414L478 432Z','#4caf50');
L+=rc(78,372,8,60,'#8a5a3b')+rc(124,372,8,60,'#8a5a3b')+rc(52,330,110,46,'#c99a5b')+`<text x="107" y="351" text-anchor="middle" font-size="17" font-weight="700" fill="#4a3426">Ashburton</text><text x="107" y="370" text-anchor="middle" font-size="17" font-weight="700" fill="#4a3426">Domain</text>`;
L+=rc(196,356,8,50,'#8a5a3b')+rc(376,356,8,50,'#8a5a3b')+rc(192,356,196,12,'#a8703f')+rc(192,374,196,12,'#a8703f')+rc(198,408,10,20,'#8a5a3b')+rc(372,408,10,20,'#8a5a3b')+rc(184,396,212,12,'#c0834d');
const cloud=id=>G(id,el(0,0,52,17,'#fff')+ci(-20,-12,19,'#fff')+ci(8,-20,23,'#fff')+ci(32,-6,15,'#fff'),DS);

/* ---------- characters (feet at 0,0, facing right) ---------- */
const boy=G('boy',G('boyLT',rc(-12,-42,46,13,'#3d6fb5')+rc(24,-42,13,42,'#3d6fb5')+rc(20,-7,22,9,'#7a3b2e'))+G('boyLS',rc(-16,-36,13,36,'#3d6fb5')+rc(3,-36,13,36,'#3d6fb5')+rc(-18,-7,20,9,'#7a3b2e')+rc(2,-7,20,9,'#7a3b2e'))+
 sh('M-21 -86L21 -86L25 -33L-25 -33Z','#f4b942')+ci(0,-106,21,'#f2b88c')+sh('M-22 -108Q-22 -132 2 -130Q24 -130 22 -108Q8 -118 -22 -108Z','#5b3a22')+dot(4,-106)+dot(14,-106)+
 G('boySmile',ln('M5 -96Q10 -91 16 -96'))+G('boyFr',ln('M6 -91Q11 -97 17 -91'))+G('boyO','<ellipse cx="10" cy="-94" rx="3.6" ry="4.8" fill="#7a2e2e"/>')+
 `<g transform="translate(0,-80)">${G('boyArm',rc(-5.5,-3,11,36,'#f4b942')+ci(0,35,6,'#f2b88c'))}</g>`,DS);
const dog=G('dog',sh('M-30 -42L-52 -68L-40 -34Z','#9a5f2e')+[-26,-9,10,24].map(x=>rc(x,-24,10,24,'#9a5f2e')).join('')+el(0,-36,36,21,'#b9783f')+ci(38,-60,17,'#c98a4f')+el(53,-53,11,8,'#e8c394')+dot(61,-55,3.2)+dot(43,-65)+ln('M50 -47Q56 -44 60 -48',2)+sh('M30 -72L20 -42L38 -52Z','#7b4723'),DS);
const cat=G('cat',sh('M-22 -38Q-62 -44 -50 -86L-40 -82Q-48 -54 -18 -28Z','#7d7d88')+[-20,-4,10,20].map(x=>rc(x,-22,9,22,'#6d6d78')).join('')+el(0,-34,28,19,'#8c8c97')+ln('M-12 -50L-9 -38M0 -52L2 -38M12 -50L14 -38',3,'#6a6a75')+
 sh('M16 -68L16 -90L30 -72Z','#8c8c97')+sh('M30 -72L44 -90L44 -66Z','#8c8c97')+ci(30,-56,16,'#9a9aa5')+dot(24,-58)+dot(37,-58)+ln('M19 -67L28 -62',3)+ln('M42 -67L33 -62',3)+sh('M30 -52L35 -52L32.5 -48Z','#f08fa0')+ln('M27 -43Q32 -48 38 -43',2)+ln('M44 -53L62 -57M44 -50L62 -49',1.5),DS);
const rab=G('rab',ci(-25,-30,9,'#fff')+el(0,-30,24,22,'#efe9df')+el(-8,-14,15,12,'#ddd5c8')+rc(12,-12,8,12,'#ddd5c8')+el(16,-90,5.5,19,'#f5f0e8','transform="rotate(-12 16 -90)"')+el(28,-90,5.5,19,'#f5f0e8','transform="rotate(12 28 -90)"')+ci(22,-60,15,'#f5f0e8')+dot(28,-62,2.4)+dot(36,-57,2.6,'#f08fa0')+ln('M36 -55L50 -58M36 -53L50 -52',1.2),DS);
const thf=G('thf','<g transform="scale(1.1)">'+rc(-16,-38,13,38,'#252b3a')+rc(3,-38,13,38,'#252b3a')+rc(-20,-7,22,9,'#111')+rc(1,-7,22,9,'#111')+sh('M-22 -88L22 -88L26 -34L-26 -34Z','#3b4a6b')+ln('M-24 -70L24 -70M-25 -56L25 -56',5,'#e8e8e8')+
 `<g transform="translate(0,-82)">${G('thArm',rc(-6,-3,12,34,'#3b4a6b')+ci(0,33,6.5,'#f2b88c'))}</g>`+ci(0,-108,21,'#f2b88c')+sh('M-22 -112Q-22 -140 0 -140Q22 -140 22 -112Z','#1d2230')+rc(-21,-112,42,13,'#1d2230')+'<ellipse cx="4" cy="-105" rx="3.6" ry="2.6" fill="#fff"/><ellipse cx="14" cy="-105" rx="3.6" ry="2.6" fill="#fff"/>'+dot(5,-105,1.5)+dot(15,-105,1.5)+ln('M5 -91Q11 -88 17 -92',2)+'</g>',DS);
const bag=G('bag',ln('M-17 -42Q0 -72 17 -42',5,'#6e2d17')+rc(-28,-42,56,42,'#b5532e')+rc(-24,-42,48,9,'#4a1d0e')+`<g transform="translate(0,-42)">${G('bagFlap',sh('M-28 0L28 0L28 17L0 25L-28 17Z','#8c3a1c')+ci(0,19,4,'#f4d35e'))}</g>`,DS);
const money=[0,1,2,3,4].map(i=>G('m'+i,rc(-22,-11,44,22,'#7bc77f')+'<rect x="-16" y="-6" width="32" height="12" fill="none" stroke="#3f8f4f" stroke-width="2"/><text y="5.5" text-anchor="middle" font-size="14" font-weight="700" fill="#2f6f3c">$10</text>',DS)).join('');
const carrot=G('carrot',sh('M-7 -10L7 -10L0 30Z','#f08a24')+sh('M0 -10L-8 -26L-1 -18L0 -30L3 -18L9 -26Z','#4caf50')+ln('M-3 0L2 0M-2 10L2 10',2,'#c46d12'),DS);
const thought=G('thought',[[-55,5,34],[-20,-22,40],[25,-24,40],[62,2,34],[5,22,40]].map(c=>ci(c[0],c[1],c[2],E)).join('')+ci(-36,62,9,E)+ci(-52,84,5.5,E)+
 `<g transform="translate(-44 0) rotate(-8)">${rc(-30,-16,50,30,'#7bc77f')}<text x="-5" y="6" text-anchor="middle" font-size="19" font-weight="900" fill="#2f6f3c">$50</text></g><g transform="translate(34 0)">${rc(-4,-24,50,40,'#6b3f24')}${ln('M9 -24V16M21 -24V16M33 -24V16M-4 -8H46M-4 8H46',1.5,'#4a2a16')}${rc(-4,-24,50,9,'#cfd2da')}</g>`,DS);
const excl=G('excl',rc(-18,-30,36,56,'#e63946')+'<text y="16" text-anchor="middle" font-size="44" font-weight="900" fill="#fff">!</text>',DS);
const conf=[...Array(18)].map((_,i)=>`<rect id="cf${i}" x="-6" y="-3" width="12" height="6" fill="${['#f28e9b','#f4b942','#3d6fb5','#7bc77f','#c77dff'][i%5]}"/>`).join('');
const endB=G('end','<g transform="rotate(2)">'+rc(-170,-40,340,80,'#e76f51')+'<text y="18" text-anchor="middle" font-size="48" font-weight="900" fill="#fffdf5">The End</text></g>',DS);
const title=G('title',`<g transform="rotate(-2 480 62)">${rc(250,22,460,82,'#f4b942')}<rect x="262" y="32" width="436" height="62" fill="none" stroke="${E}" stroke-width="2" stroke-dasharray="7 5"/><text x="480" y="80" text-anchor="middle" font-size="46" font-weight="900" fill="#4a3426">The Stolen Bag</text></g>`,DS);
let sd='M0 462';for(let x=0;x<=960;x+=20)sd+=`L${x} ${(458+(x/20%2?6:0)+Math.sin(x)*2).toFixed(1)}`;sd+='L960 540L0 540Z';
const strip=`<g ${DS}>${sh(sd,'#fff7e6')}<rect x="20" y="446" width="64" height="22" fill="#f28e9b" opacity=".85" transform="rotate(-8 52 457)"/><rect x="876" y="446" width="64" height="22" fill="#7bc7d9" opacity=".85" transform="rotate(7 908 457)"/></g><text id="capT" x="480" text-anchor="middle" font-size="27" font-weight="700" fill="#4a3426"></text>`;

svg.innerHTML=`<defs>
<filter id="ds" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="2" dy="4" stdDeviation="2.2" flood-color="#32230f" flood-opacity=".42"/></filter>
<filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="5"/></filter>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="2"/><feColorMatrix values="0 0 0 0 .3 0 0 0 0 .22 0 0 0 0 .12 .22 0 0 0 -.03"/></filter></defs>
<rect width="960" height="540" fill="#bfe5f2"/>${sky}<g filter="url(#rough)">${L}</g>
${thf+cat+dog+rab+boy+bag+money+carrot+thought+excl}<g id="bl"></g>${conf+endB+title+strip}
<rect width="960" height="540" filter="url(#grain)" pointer-events="none"/>`;

/* ---------- timeline engine ---------- */
const TR={},AT=[],CAP=[],BUB=[],DEF={x:0,y:0,r:0,sx:1,sy:1,o:1},P=['x','y','r','sx','sy','o'];
const last=id=>TR[id][TR[id].length-1];
function K(id,t,p={},e){const a=TR[id]||(TR[id]=[]);a.push({...(a.length?last(id):DEF),...p,t,e})}
const go=(id,a,b,x,y)=>{K(id,a);K(id,b,{x,y:y??last(id).y})};
const face=(id,t,s)=>{K(id,t);K(id,t+.15,{sx:s})};
const show=(id,t)=>{K(id,t,{o:0,sx:.2,sy:.2});K(id,t+.35,{o:1,sx:1,sy:1})};
const hide=(id,t)=>{K(id,t);K(id,t+.3,{o:0,sx:.2,sy:.2})};
const att=(id,to,dx,dy,t0,t1)=>AT.push({id,to,dx,dy,t0,t1});
const cap=(t0,t1,text)=>CAP.push({t0,t1,text});
const wrap=(s,n)=>{let o=[],c='';for(const w of s.split(' ')){if(c&&(c+' '+w).length>n){o.push(c);c=w}else c=c?c+' '+w:w}o.push(c);return o};
const bl=document.getElementById('bl');
function say(who,t0,text,style){
 const d=style==='burst'?1.5:Math.max(1.8,text.length*.055+.8);let w,h,body,tl=0;
 if(style==='burst'){w=h=150;const pts=[...Array(20)].map((_,i)=>{const a=i*Math.PI/10,r=i%2?52:75;return(Math.cos(a)*r).toFixed(1)+','+(Math.sin(a)*r).toFixed(1)}).join(' ');
  body=`<polygon points="${pts}" fill="#ffe066" stroke="${E}" stroke-width="5" stroke-linejoin="round"/><text y="16" text-anchor="middle" font-size="46" font-weight="900" fill="#d62839">${text}</text>`}
 else{const Ls=wrap(text,20);w=Math.max(...Ls.map(l=>l.length))*11.6+36;h=Ls.length*26+22;tl=1;
  body=`<path class="tl" fill="${E}" stroke="${E}" stroke-width="5" stroke-linejoin="round"/><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" rx="14" fill="${E}" stroke="${E}" stroke-width="5"/><text text-anchor="middle" font-size="21" font-weight="600" fill="#4a3426">${Ls.map((l,i)=>`<tspan x="0" y="${-h/2+28+i*26}">${l}</tspan>`).join('')}</text>`}
 bl.insertAdjacentHTML('beforeend',`<g display="none" ${DS}>${body}</g>`);
 const g=bl.lastElementChild;BUB.push({who,t0,t1:t0+d,w,h,g,tl:tl?g.querySelector('.tl'):null,burst:style==='burst'});return t0+d}

/* ---------- the story ---------- */
K('boy',0,{x:290,y:428});K('boyLT',0);K('boyLS',0,{o:0});K('boySmile',0);K('boyFr',0,{o:0});K('boyO',0,{o:0});K('boyArm',0);
for(const n of['dog','cat','rab','thf'])K(n,0,{x:1100,y:428,sx:-1});
K('thArm',0);K('bag',0,{x:362,y:396});K('carrot',0,{o:0,x:462,y:422});
for(let i=0;i<5;i++)K('m'+i,0,{o:0});
K('thought',0,{o:0,x:370,y:205,sx:.2,sy:.2});K('excl',0,{o:0,x:290,y:262,sx:.2,sy:.2});K('end',0,{o:0,x:480,y:135,sx:.2,sy:.2});K('title',0,{y:-200});

K('title',.3);K('title',1,{y:0});K('title',4.2);K('title',5.2,{y:-200});
cap(1.2,6,"One day, a boy was sitting on a bench at the Ashburton Domain.");
show('thought',6.2);hide('thought',11);cap(6.2,11.3,"He had $50 and he was going to buy a chocolate bar.");

// the theft
cap(11.6,17,"But suddenly, a guy stole his bag with his money!");
go('thf',11.4,14,392);K('thArm',14);K('thArm',14.6,{r:-90});
K('bag',14.3);att('bag','thf',40,-48,14.3,1e9);
K('boyArm',14.6);K('boyArm',15.1,{r:-170});K('boyArm',16.2);K('boyArm',17,{r:0});
K('boySmile',14.8);K('boySmile',14.81,{o:0});K('boyO',14.8);K('boyO',14.81,{o:1});show('excl',14.5);hide('excl',16.3);
face('thf',14.8,1);go('thf',15,17,1120);
K('boyLT',16.2);K('boyLT',16.21,{o:0});K('boyLS',16.2);K('boyLS',16.21,{o:1});
K('boyO',17.8);K('boyO',17.81,{o:0});K('boyFr',17.8);K('boyFr',17.81,{o:1});

// dog
go('dog',17.2,19.2,705);go('boy',17.8,20,500);cap(17.4,27.7,"The boy asked a dog for help. But the dog said no.");
let e=say('boy',20.2,"Someone stole my bag! Can you help?");
e=say('dog',e+.2,"No, thank you. Please, no.");face('dog',e+.2,1);go('dog',e+.5,e+2.5,1120);

// cat
const c0=e+2.4;go('cat',c0,c0+2.1,705);
e=say('boy',c0+2.3,"Excuse me, someone stole my bag. Can you help me find something?");
e=say('cat',e+.2,"No, no, no! I will not help you, please!");
e=say('cat',e+.1,"NO!",'burst');face('cat',e+.1,1);go('cat',e+.4,e+2.4,1120);
cap(c0+.2,e+2.2,"Next, he asked a cat. But the cat was very grumpy!");

// rabbit
const r0=e+2.3;go('rab',r0,r0+2.2,705);
e=say('boy',r0+2.4,"Please, would you help?");
const B=say('rab',e+.2,"Hmm... fine, but you must give me a carrot.");
cap(r0+.3,B+.3,"Then he saw a rabbit. The rabbit wanted a carrot first!");

// the carrot
face('boy',B+.2,-1);K('boyArm',B+.2);K('boyArm',B+.7,{r:-30});K('boyArm',B+1.3,{r:-100});K('boyArm',B+4);K('boyArm',B+4.6,{r:0});
show('carrot',B+.6);K('carrot',B+1.3);att('carrot','boy',40,-82,B+1.3,B+4.1);
face('boy',B+2,1);go('boy',B+2.2,B+4,615);
K('carrot',B+4.1,{x:655,y:346,r:0});K('carrot',B+5,{x:679,y:394,r:60});att('carrot','rab',26,-34,B+5,1e9);
cap(B+.5,B+5.3,"So the boy got a carrot and gave it to the rabbit.");

// the guy comes back, the rabbit hops
face('thf',B+5,-1);go('thf',B+5.4,B+7.6,800);cap(B+5.5,B+8.2,"Just then, the guy with the bag came walking by.");
face('rab',B+7.2,1);K('carrot',B+7.2);K('carrot',B+7.35,{r:-60});
cap(B+8.3,B+12,"The rabbit jumped in the air and accidentally stepped on the guy\u2019s foot!");
K('rab',B+8.6);K('rab',B+8.9,{sy:.75});K('rab',B+9.02,{sy:1});K('rab',B+9.6,{x:745,y:300,r:-18});K('rab',B+10.1,{x:787,y:420,r:0});K('rab',B+10.25,{sy:.8});K('rab',B+10.45,{sy:1});K('rab',B+11.2);K('rab',B+11.8,{x:765,y:428});
K('thf',B+10.1);K('thf',B+10.45,{y:392,r:-10});K('thf',B+10.8,{y:428,r:0});
K('thArm',B+10.1);K('thArm',B+10.5,{r:-150});K('thArm',B+11.1,{r:0});say('thf',B+10.2,"Ouch!");

// the bag falls and the money spills
K('bag',B+10.4,{x:760,y:346});K('bag',B+11.3,{x:742,y:428,r:-80});K('bagFlap',B+10.4);K('bagFlap',B+10.9,{sy:-.8});
for(let i=0;i<5;i++){const s=B+11.3,m='m'+i;K(m,s,{o:0,x:742,y:415});K(m,s+.1,{o:1});K(m,s+.6,{x:760+(i-2)*30,y:330-(i%2)*20,r:(i-2)*60});K(m,s+1.3,{x:724+i*28,y:424+(i%2)*6,r:(i-2)*25})}
face('thf',B+10.9,1);go('thf',B+11.1,B+12.9,1120);
cap(B+12.1,B+15.5,"The bag opened and fell on the ground, and the money fell out!");

// money back
go('boy',B+12.2,B+14,715);K('boyFr',B+14);K('boyFr',B+14.01,{o:0});K('boySmile',B+14);K('boySmile',B+14.01,{o:1});
K('boyArm',B+14);K('boyArm',B+14.5,{r:-170});
for(let i=0;i<5;i++){const ts=B+14.6+i*.12,m='m'+i;K(m,ts);K(m,ts+.5,{sx:.8,sy:.8,r:(i-2)*14});att(m,'boy',8+(i-2)*9,-122-Math.abs(i-2)*3,ts,1e9)}
K('boy',B+15.4);K('boy',B+15.7,{y:398});K('boy',B+16,{y:428});K('boy',B+16.2);K('boy',B+16.5,{y:398});K('boy',B+16.8,{y:428});
cap(B+15.6,B+19.6,"And finally, he got his money back!");

const HT={boy:132,dog:78,cat:90,rab:112,thf:165},AMP={boy:5,dog:7,cat:6,rab:15,thf:7},D={};

function ev(a,t){if(t<=a[0].t)return a[0];for(let i=a.length-1;i>=0;i--)if(a[i].t<=t){const p=a[i],q=a[i+1];if(!q)return p;let u=(t-p.t)/(q.t-p.t);if(q.e!=='l')u=u*u*(3-2*u);const o={};for(const k of P)o[k]=p[k]+(q[k]-p[k])*u;return o}}
function render(t){

 for(const id in AMP){const s=S[id],p=prev[id];prev[id]={x:s.x,y:s.y};

 for(const b of BUB){if(t<b.t0||t>=b.t1){b.g.setAttribute('display','none');continue}
  const s=S[b.who],ax=s.x,ay=s.y-HT[b.who],bx=Math.min(Math.max(ax,b.w/2+10),950-b.w/2),by=Math.max(ay-20-b.h/2,b.h/2+8);

}
