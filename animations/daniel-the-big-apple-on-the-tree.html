<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Big Apple on the Tree</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#241a12;overflow:hidden}
  #stage{
    position:absolute;left:50%;top:50%;
    width:min(100vw,177.7778vh);height:min(56.25vw,100vh);
    transform:translate(-50%,-50%);overflow:hidden;background:#bfe3ee;--u:10px;
    font-family:"Chalkboard SE","Comic Sans MS","Segoe Print","Marker Felt","Trebuchet MS",sans-serif;
  }
  svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .tx{font-family:inherit;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round}
  #grain{position:absolute;inset:0;pointer-events:none;opacity:.55;box-shadow:inset 0 0 12vmin rgba(70,35,10,.35)}
  #capwrap{
    position:absolute;left:50%;bottom:1.6%;width:76%;
    transform:translateX(-50%) rotate(-.4deg);
    filter:drop-shadow(0 .5vmin .6vmin rgba(40,25,10,.45));
    opacity:0;transition:opacity .45s;pointer-events:none;
  }
  #capwrap.on{opacity:1}
  #cap{background:#fffaf0;color:#4a2f1b;text-align:center;font-weight:700;
    font-size:calc(var(--u)*2);line-height:1.22;padding:.55em 1.3em .6em}
  #replay{
    position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) rotate(-2deg) scale(.6);
    opacity:0;pointer-events:none;transition:opacity .6s,transform .6s cubic-bezier(.3,1.6,.5,1);
    border:0;cursor:pointer;font-family:inherit;font-weight:700;
    font-size:calc(var(--u)*3.4);color:#fff;background:#4fae5b;
    padding:.45em 1.1em;border-radius:.5em;
    box-shadow:0 0 0 .18em rgba(255,255,255,.85) inset,.2em .4em 0 rgba(40,25,10,.35);
    text-shadow:0 .06em 0 rgba(0,0,0,.25);
  }
  #replay.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) rotate(-2deg) scale(1)}
  #replay:hover{background:#43a050}
  #replay:active{transform:translate(-50%,-50%) rotate(-2deg) scale(.95)}
</style>
</head>
<body>
<div id="stage">
  <svg id="svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice">
    <defs id="defs">
      <filter id="sh" x="-30%" y="-30%" width="160%" height="170%">
        <feDropShadow dx="3" dy="5" stdDeviation="2.4" flood-color="#2b1b0c" flood-opacity=".34"/>
      </filter>
      <filter id="shs" x="-30%" y="-30%" width="160%" height="170%">
        <feDropShadow dx="1.5" dy="2.5" stdDeviation="1.3" flood-color="#2b1b0c" flood-opacity=".3"/>
      </filter>
    </defs>
    <g id="world"></g>
  </svg>
  <div id="grain"></div>
  <div id="capwrap"><div id="cap"></div></div>
  <button id="replay" type="button">&#8635; Replay</button>
</div>

<script>
(()=>{
'use strict';
/* ------------------------------------------------------------------
   Tiny helpers
------------------------------------------------------------------ */
const NS='http://www.w3.org/2000/svg';
const $=i=>document.getElementById(i);
const defs=$('defs'),world=$('world'),stage=$('stage'),cap=$('cap'),capwrap=$('capwrap'),btn=$('replay'),grainDiv=$('grain');
const PI=Math.PI;
let L={},T=[],seed=11,pid=0;
const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const R=(a,b)=>a+rnd()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function el(tag,at,parent){
  const e=document.createElementNS(NS,tag);
  if(at)for(const k in at)e.setAttribute(k,at[k]);
  if(parent)parent.appendChild(e);
  return e;
}

/* ---------- paper-cut geometry: polygons with a hand-cut wobble ---------- */
function jpoly(pts,j){
  return 'M'+pts.map(p=>(p[0]+(rnd()-.5)*2*j).toFixed(1)+' '+(p[1]+(rnd()-.5)*2*j).toFixed(1)).join('L')+'Z';
}
function ellPts(cx,cy,rx,ry,n=20,rot=0){
  const out=[],c=Math.cos(rot*PI/180),s=Math.sin(rot*PI/180);
  for(let i=0;i<n;i++){const a=i/n*PI*2,x=Math.cos(a)*rx,y=Math.sin(a)*ry;out.push([cx+x*c-y*s,cy+x*s+y*c]);}
  return out;
}
function rectPts(x,y,w,h,n=2){
  const p=[];
  for(let i=0;i<=n;i++)p.push([x+w*i/(n+1),y]);
  for(let i=0;i<=n;i++)p.push([x+w,y+h*i/(n+1)]);
  for(let i=0;i<=n;i++)p.push([x+w-w*i/(n+1),y+h]);
  for(let i=0;i<=n;i++)p.push([x,y+h-h*i/(n+1)]);
  return p;
}
function applePts(r,n=26){
  const o=[];
  for(let i=0;i<n;i++){
    const a=i/n*PI*2,d=Math.atan2(Math.sin(a+PI/2),Math.cos(a+PI/2));
    const rr=r*(1-.1*Math.exp(-d*d/.12));
    o.push([Math.cos(a)*rr*1.04,Math.sin(a)*rr*.98]);
  }
  return o;
}
function P(parent,pts,fill,o={}){
  return el('path',{d:jpoly(pts,o.j===undefined?1.1:o.j),fill,stroke:o.stroke||'rgba(255,255,255,.55)','stroke-width':o.sw===undefined?2.2:o.sw,'stroke-linejoin':'round'},parent);
}
function pat(kind,bg,fg){
  const id='pt'+(pid++);
  const p=el('pattern',{id,width:14,height:14,patternUnits:'userSpaceOnUse'},defs);
  el('rect',{width:14,height:14,fill:bg},p);
  if(kind==='dots')el('circle',{cx:7,cy:7,r:2.6,fill:fg},p);
  if(kind==='stripes')el('rect',{y:0,width:14,height:5,fill:fg},p);
  if(kind==='plaid'){el('rect',{width:14,height:4,y:5,fill:fg,opacity:.65},p);el('rect',{width:4,height:14,x:5,fill:fg,opacity:.65},p);}
  return `url(#${id})`;
}

/* ---------- easing / tweening ---------- */
const EASE={
  lin:t=>t,
  io:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,
  out:t=>1-Math.pow(1-t,3),
  in:t=>t*t,
  back:t=>{const c=1.70158,d=c+1;return 1+d*Math.pow(t-1,3)+c*Math.pow(t-1,2)},
  bounce:t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d){t-=1.5/d;return n*t*t+.75}if(t<2.5/d){t-=2.25/d;return n*t*t+.9375}t-=2.625/d;return n*t*t+.984375}
};
function anim(ms,fn,ease='io'){
  return new Promise(res=>{
    const t0=performance.now(),e=EASE[ease];
    const f=now=>{const r=clamp((now-t0)/ms,0,1);fn(e(r),r);if(r<1)requestAnimationFrame(f);else res();};
    requestAnimationFrame(f);
  });
}
const sleep=ms=>anim(ms,()=>{},'lin');
const waitFor=c=>new Promise(res=>{const f=()=>c()?res():requestAnimationFrame(f);f();});
function to(o,props,ms,ease='io'){
  const a=o.p||o,from={};
  for(const k in props)from[k]=a[k];
  return anim(ms,t=>{for(const k in props)a[k]=from[k]+(props[k]-from[k])*t;if(o.apply)o.apply();},ease);
}
function actor(g,init,extra){
  const o={g,p:Object.assign({x:0,y:0,rot:0,s:1,sx:1,sy:1,fl:1,o:1},init)};
  o.apply=()=>{
    const p=o.p;
    g.setAttribute('transform',`translate(${p.x.toFixed(2)} ${p.y.toFixed(2)}) rotate(${p.rot.toFixed(2)}) scale(${(p.s*p.sx*p.fl).toFixed(4)} ${(p.s*p.sy).toFixed(4)})`);
    g.setAttribute('opacity',p.o);
    if(extra)extra(o);
  };
  o.apply();
  return o;
}
function wp(a,lx,ly){
  const p=a.p,r=p.rot*PI/180,X=lx*p.s*p.fl,Y=ly*p.s;
  return{x:p.x+X*Math.cos(r)-Y*Math.sin(r),y:p.y+X*Math.sin(r)+Y*Math.cos(r)};
}

/* ------------------------------------------------------------------
   Characters
------------------------------------------------------------------ */
function makePerson(layer,o){
  const g=el('g',{filter:'url(#sh)'},layer);
  const legH=o.legH||56;
  const legL=el('g',{},g),legR=el('g',{},g);
  [legL,legR].forEach(l=>{P(l,rectPts(-6,0,12,legH,1),o.legs);P(l,ellPts(-1,legH+3,11,5,10),'#3a2a22');});
  const body=el('g',{},g);
  if(o.type==='long')P(body,[[-28,-172],[28,-172],[36,-112],[28,-90],[-28,-90],[-36,-112]],o.hair,{j:1.5});
  if(o.type==='pig'){
    [-1,1].forEach(s=>{
      P(body,ellPts(s*31,-132,9,18,12,s*18),o.hair);
      P(body,[[s*26,-152],[s*40,-160],[s*40,-144]],'#e8423a');
    });
  }
  if(o.dress)P(body,[[-20,-128],[20,-128],[38,-52],[-38,-52]],o.shirt,{j:1.6});
  else P(body,rectPts(-25,-128,50,72,2),o.shirt,{j:1.4});
  const head=el('g',{},body);
  P(head,ellPts(0,-155,23,25,22),o.skin,{j:.8});
  // hair
  const top=[];
  for(let i=0;i<=14;i++){const a=PI+i/14*PI;top.push([Math.cos(a)*26,-157+Math.sin(a)*29]);}
  if(o.type==='hat'){
    P(head,[[-24,-150],[-26,-166],[-22,-176],[-17,-176],[-20,-158],[-20,-150]],o.hair,{j:.6});
    P(head,[[24,-150],[26,-166],[22,-176],[17,-176],[20,-158],[20,-150]],o.hair,{j:.6});
  }else if(o.type==='spiky'){
    P(head,[[-24,-152],[-26,-168],[-16,-176],[-14,-192],[-5,-178],[0,-196],[6,-178],[15,-192],[17,-176],[26,-168],[24,-152],[12,-160],[0,-153],[-12,-160]],o.hair,{j:1});
  }else{
    P(head,top.concat([[22,-150],[12,-143],[4,-152],[-6,-142],[-16,-150],[-23,-148]]),o.hair,{j:1});
  }
  if(o.type==='hat'){
    P(head,ellPts(0,-176,42,8,20),'#e8c36a',{j:1.2});
    P(head,[[-23,-176],[-19,-204],[19,-204],[23,-176]],'#eed07e',{j:1});
    P(head,rectPts(-22,-186,44,8,2),'#d6342b',{j:.6});
  }
  el('circle',{cx:-8,cy:-154,r:2.9,fill:'#2b1c14'},head);
  el('circle',{cx:8,cy:-154,r:2.9,fill:'#2b1c14'},head);
  el('circle',{cx:-15,cy:-146,r:4.5,fill:'#f08a80',opacity:.6},head);
  el('circle',{cx:15,cy:-146,r:4.5,fill:'#f08a80',opacity:.6},head);
  const mS=el('path',{d:'M-7 -144 Q0 -135 7 -144',stroke:'#2b1c14','stroke-width':2.4,fill:'none','stroke-linecap':'round'},head);
  const mO=el('ellipse',{cx:0,cy:-141,rx:4,ry:5,fill:'#2b1c14',display:'none'},head);
  // arms
  const mkArm=()=>{const a=el('g',{},body);P(a,rectPts(-6.5,-2,13,38,1),o.sleeve||o.shirt,{j:.8});P(a,rectPts(-5,34,10,36,1),o.skin,{j:.6});P(a,ellPts(0,72,7.5,7.5,10),o.skin,{j:.5});return a;};
  const armL=mkArm(),armR=mkArm();
  const hipY=-(legH+8);
  const a=actor(g,{s:o.s||1,al:8,ar:-8,lg:0,bob:0,hd:0,mood:0},A=>{
    const p=A.p;
    legL.setAttribute('transform',`translate(-10 ${hipY}) rotate(${p.lg})`);
    legR.setAttribute('transform',`translate(10 ${hipY}) rotate(${-p.lg})`);
    body.setAttribute('transform',`translate(0 ${-p.bob})`);
    head.setAttribute('transform',`rotate(${p.hd} 0 -132)`);
    armL.setAttribute('transform',`translate(-23 -121) rotate(${p.al})`);
    armR.setAttribute('transform',`translate(23 -121) rotate(${p.ar})`);
    mS.setAttribute('display',p.mood?'none':'inline');
    mO.setAttribute('display',p.mood?'inline':'none');
  });
  return a;
}

function makeDog(layer){
  const g=el('g',{filter:'url(#sh)'},layer);
  const tan='#d8a263',dk='#b27238',lt='#f4ddb6';
  const tail=el('g',{},g);
  P(tail,[[0,0],[14,-26],[22,-46],[13,-50],[1,-28],[-5,-2]],dk);
  const legs=[-36,-20,22,38].map((x,i)=>{
    const l=el('g',{},g);
    P(l,rectPts(-5,0,10,36,1),i%2?dk:tan);
    P(l,ellPts(0,37,8,4,8),'#6f4520');
    return {l,x};
  });
  P(g,ellPts(0,-52,56,27,26),tan,{j:1.4});
  P(g,ellPts(0,-42,40,13,16),lt);
  P(g,ellPts(20,-66,17,10,12),dk);
  const head=el('g',{},g);
  P(head,ellPts(-60,-74,24,22,20),tan);
  P(head,ellPts(-85,-66,17,11,14),lt);
  P(head,ellPts(-98,-70,5.5,4.5,8),'#2b2020');
  P(head,ellPts(-92,-55,5,8,8),'#ef8f9a');
  P(head,ellPts(-50,-90,11,19,10,22),dk);
  el('circle',{cx:-68,cy:-79,r:3.4,fill:'#2b1c14'},head);
  const a=actor(g,{lg:0,bob:0,hd:0,tail:0},A=>{
    const p=A.p;
    legs.forEach((q,i)=>q.l.setAttribute('transform',`translate(${q.x} -36) rotate(${(i%2?-1:1)*p.lg})`));
    tail.setAttribute('transform',`translate(50 -66) rotate(${p.tail})`);
    head.setAttribute('transform',`translate(0 ${-p.bob}) rotate(${p.hd} -52 -62)`);
  });
  return a;
}

function makeCat(layer,col,dk,s){
  const g=el('g',{filter:'url(#shs)'},layer);
  const tail=el('g',{},g);
  P(tail,[[0,0],[18,-6],[30,-26],[26,-46],[36,-48],[44,-24],[34,0],[10,10]],dk);
  const body=el('g',{},g);
  P(body,ellPts(0,-30,26,32,20),col,{j:1});
  P(body,ellPts(0,-24,15,22,14),'#f8ecd8');
  P(body,[[-24,-40],[-14,-36],[-24,-30]],dk);
  P(body,[[24,-40],[14,-36],[24,-30]],dk);
  P(body,ellPts(-10,-2,8,5,8),col);
  P(body,ellPts(10,-2,8,5,8),col);
  const head=el('g',{},body);
  P(head,[[-19,-82],[-23,-106],[-6,-91]],col,{j:.6});
  P(head,[[19,-82],[23,-106],[6,-91]],col,{j:.6});
  P(head,[[-17,-85],[-19,-99],[-9,-90]],'#f3a3a8',{j:.3});
  P(head,[[17,-85],[19,-99],[9,-90]],'#f3a3a8',{j:.3});
  P(head,ellPts(0,-74,22,19,20),col,{j:.8});
  P(head,[[-3,-93],[0,-83],[3,-93]],dk,{j:.3});
  el('circle',{cx:-8,cy:-76,r:4,fill:'#9be07a'},head);
  el('circle',{cx:8,cy:-76,r:4,fill:'#9be07a'},head);
  el('ellipse',{cx:-8,cy:-76,rx:1.3,ry:3.2,fill:'#2b1c14'},head);
  el('ellipse',{cx:8,cy:-76,rx:1.3,ry:3.2,fill:'#2b1c14'},head);
  el('path',{d:'M-3 -70 L3 -70 L0 -66Z',fill:'#e98a95'},head);
  el('path',{d:'M0 -66 Q-4 -61 -8 -64 M0 -66 Q4 -61 8 -64',stroke:'#4a2f1b','stroke-width':1.5,fill:'none','stroke-linecap':'round'},head);
  el('path',{d:'M-12 -68 L-30 -72 M-12 -65 L-30 -63 M12 -68 L30 -72 M12 -65 L30 -63',stroke:'#fff8ea','stroke-width':1.5,fill:'none','stroke-linecap':'round'},head);
  return actor(g,{s,tail:0,bob:0,hd:0},A=>{
    const p=A.p;
    tail.setAttribute('transform',`translate(20 -6) rotate(${p.tail})`);
    body.setAttribute('transform',`translate(0 ${-p.bob})`);
    head.setAttribute('transform',`rotate(${p.hd} 0 -60)`);
  });
}

function mkApple(parent,r){
  const g=el('g',{},parent);
  P(g,applePts(r,18),'#d6342b',{sw:r>30?3:2});
  P(g,ellPts(-r*.45,-r*.28,r*.2,r*.32,10,25),'#f27a66',{sw:0,j:.4});
  el('path',{d:`M0 ${-r*.8} L${r*.07} ${-r*1.25}`,stroke:'#6b4a2b','stroke-width':Math.max(2.4,r*.09),fill:'none','stroke-linecap':'round'},g);
  P(g,[[r*.1,-r*.95],[r*.5,-r*1.3],[r*.85,-r*1.1],[r*.5,-r*.82]],'#4aa14e',{j:.5,sw:1.5});
  return g;
}

/* ------------------------------------------------------------------
   Effects
------------------------------------------------------------------ */
function burst(txt,x,y,o={}){
  const col=o.c||'#ffd23f',r=o.r||70,n=14;
  const g=el('g',{filter:'url(#shs)'},L.fx);
  const pts=[];
  for(let i=0;i<n*2;i++){const a=i/(n*2)*PI*2,rr=i%2?r*.7:r;pts.push([Math.cos(a)*rr,Math.sin(a)*rr]);}
  P(g,pts,col,{j:3,sw:3});
  if(txt){const t=el('text',{'text-anchor':'middle',y:(o.fs||36)*.34,'font-size':o.fs||36,fill:o.tc||'#c1272d',class:'tx'},g);t.textContent=txt;}
  const a=actor(g,{x,y,s:0,rot:o.rot===undefined?-8:o.rot});
  to(a,{s:1},320,'back').then(()=>sleep(o.hold||900)).then(()=>to(a,{s:0,o:0},300,'in')).then(()=>g.remove());
  return a;
}
function bubble(txt,x,y,hold=1800,fs=30){
  const w=txt.length*fs*.58+46,h=fs+30;
  const g=el('g',{filter:'url(#shs)'},L.fx);
  P(g,rectPts(-w/2,-h/2,w,h,3),'#ffffff',{j:2,sw:3});
  P(g,[[-18,h/2-2],[-30,h/2+24],[2,h/2-2]],'#ffffff',{j:1,sw:3});
  const t=el('text',{'text-anchor':'middle',y:fs*.34,'font-size':fs,fill:'#4a2f1b',style:'font-family:inherit;font-weight:700'},g);
  t.textContent=txt;
  const a=actor(g,{x,y,s:0});
  to(a,{s:1},300,'back').then(()=>sleep(hold)).then(()=>to(a,{s:0,o:0},250,'in')).then(()=>g.remove());
  return a;
}
function bulb(x,y){
  const g=el('g',{filter:'url(#shs)'},L.fx);
  for(let i=0;i<7;i++){const a=-PI+i/6*PI,c=Math.cos(a),s=Math.sin(a);P(g,[[c*32-s*4,s*32+c*4],[c*48,s*48],[c*32+s*4,s*32-c*4]],'#ffd23f',{j:.5,sw:1});}
  P(g,ellPts(0,0,22,24,18),'#ffe86a',{sw:3});
  P(g,rectPts(-10,22,20,14,1),'#9aa0a6',{j:.5});
  const a=actor(g,{x,y,s:0,rot:-6});
  to(a,{s:1},380,'back').then(()=>sleep(2000)).then(()=>to(a,{s:0,o:0},250,'in')).then(()=>g.remove());
}
function puff(x,y,n=4,c='#fff7ea'){
  for(let i=0;i<n;i++){
    const g=el('g',{},L.fx),px=x+R(-40,40),py=y+R(-8,6),sz=R(.7,1.3);
    P(g,ellPts(0,0,16,14,10),c,{sw:0});
    const a=actor(g,{x:px,y:py,s:.2,o:.9});
    anim(750,(t)=>{a.p.s=.2+sz*t;a.p.y=py-18*t;a.p.o=.9*(1-t);a.apply();},'out').then(()=>g.remove());
  }
}
function drop(x,y,dir,col='#5ec1f0'){
  const g=el('path',{d:'M0 -8 Q7 3 0 7 Q-7 3 0 -8Z',fill:col,stroke:'rgba(255,255,255,.6)','stroke-width':1.4},L.fx);
  anim(850,(t,r)=>{g.setAttribute('transform',`translate(${x+dir*34*r} ${y-26*Math.sin(r*PI*.9)+70*r*r})`);g.setAttribute('opacity',1-r*r);},'lin').then(()=>g.remove());
}
function crumb(x,y){
  const g=el('path',{d:'M0 -4 L4 0 L0 4 L-4 0Z',fill:Math.random()<.5?'#e8c36a':'#fff1a6'},L.fx);
  const dx=R(-34,34)*1,vy=-R(20,40);
  anim(650,(t,r)=>{g.setAttribute('transform',`translate(${x+dx*r} ${y+vy*Math.sin(r*PI)+80*r*r}) rotate(${r*300})`);g.setAttribute('opacity',1-r);},'lin').then(()=>g.remove());
}

/* ------------------------------------------------------------------
   Caption + paper grain
------------------------------------------------------------------ */
function torn(){
  const n=40,pts=[];
  for(let i=0;i<=n;i++)pts.push(`${(i/n*100).toFixed(2)}% ${(i%2?0:3.2+Math.random()*2.2).toFixed(1)}%`);
  for(let i=n;i>=0;i--)pts.push(`${(i/n*100).toFixed(2)}% ${(100-(i%2?0:3.2+Math.random()*2.2)).toFixed(1)}%`);
  cap.style.clipPath=`polygon(${pts.join(',')})`;
}
function say(t){
  capwrap.classList.remove('on');
  setTimeout(()=>{cap.textContent=t;capwrap.classList.add('on');},300);
}
function makeGrain(){
  const c=document.createElement('canvas');c.width=c.height=256;
  const x=c.getContext('2d'),im=x.createImageData(256,256);

      if(sweatT<=0){sweatT=.5;const m=pull.members[Math.floor(Math.random()*pull.members.length)],q=wp(m,(Math.random()<.5?-1:1)*22,-170);drop(q.x,q.y,q.x>m.p.x?1:-1);}
    }
  });
  setOrb(.6);setNight(0);
  treats=[];
  steamA=null;tableA=null;buntA=null;
}
let treats=[];

/* ------------------------------------------------------------------
   Table & dinner pieces (built when needed)
------------------------------------------------------------------ */
function makeTable(){
  const g=el('g',{filter:'url(#sh)'},L.table);
  const cloth=pat('plaid','#fff6e8','#e0453a');
  P(g,[[595,538],[1105,538],[1138,568],[562,568]],'#fffaf0',{j:1.5,sw:3});
  const front=[[562,568],[1138,568]];
  for(let x=1138;x>=562;x-=34){front.push([x-17,664]);front.push([x-34,650]);}
  P(g,front,cloth,{j:1.2,sw:3});
  P(g,rectPts(562,568,576,8,16),'#c6372d',{j:.8,sw:0});
  const items=el('g',{},g);
  // plates for people
  [650,730,1000,1075].forEach(x=>{P(items,ellPts(x,556,34,7,16),'#9cc3e6',{j:.6,sw:1.5});P(items,ellPts(x,555,26,5,16),'#ffffff',{j:.5,sw:0});});
  const mk=(x,y)=>{const a=el('g',{},items);return actor(a,{x,y,s:0});};
  // platter of apple slices
  const plat=mk(815,556);
  P(plat.g,ellPts(0,0,66,14,22),'#9cc3e6',{j:.8});P(plat.g,ellPts(0,-2,56,10,22),'#ffffff',{j:.6,sw:0});
  for(let i=0;i<6;i++){
    const cx=-40+i*16,cy=-9+(i%2)*3,arc=[];
    for(let k=0;k<=7;k++){const a=PI*(1.1+k/7*.8);arc.push([cx+Math.cos(a)*22,cy+Math.sin(a)*22+16]);}
    P(plat.g,arc.concat([[cx+14,cy+2],[cx,cy-1],[cx-14,cy+2]]),'#fff1a6',{j:.4,sw:1});
    const rim=[];for(let k=0;k<=7;k++){const a=PI*(1.1+k/7*.8);rim.push([cx+Math.cos(a)*22,cy+Math.sin(a)*22+16]);}
    for(let k=7;k>=0;k--){const a=PI*(1.1+k/7*.8);rim.push([cx+Math.cos(a)*18,cy+Math.sin(a)*18+16]);}
    P(plat.g,rim,'#d6342b',{j:.3,sw:0});
  }
  // pie
  const pie=mk(888,556);
  P(pie.g,[[-66,0],[66,0],[60,-26],[-60,-26]],'#d9984e',{j:1});
  P(pie.g,ellPts(0,-26,62,14,24),'#eab867',{j:1});
  for(let i=-2;i<=2;i++)P(pie.g,rectPts(i*21-3,-33,6,14,1),'#c27f33',{j:.5,sw:0});
  // jug
  const jug=mk(944,556);
  P(jug.g,rectPts(-14,-48,28,48,2),'#e7a735',{j:.8});
  P(jug.g,rectPts(-17,-52,34,8,2),'#c98a1f',{j:.6});
  el('path',{d:'M14 -38 Q32 -36 26 -14 Q24 -8 14 -10',stroke:'#c98a1f','stroke-width':5,fill:'none','stroke-linecap':'round'},jug.g);
  // steam
  const sg=el('g',{},g);
  [[870,0],[890,1],[910,2]].forEach(([x,i])=>el('path',{d:`M${x} 510 q-8 -12 0 -22 q8 -10 0 -22`,stroke:'#ffffff','stroke-width':5,fill:'none','stroke-linecap':'round',opacity:.0,class:'st'+i},sg));
  const st=[...sg.querySelectorAll('path')];
  T.push((dt,t)=>{st.forEach((s,i)=>{if(!tableA||!tableA.fed)return;const ph=(t*.6+i*.33)%1;s.setAttribute('transform',`translate(0 ${-ph*26})`);s.setAttribute('opacity',(1-ph)*.75);});});
  const ta=actor(g,{y:-760});
  ta.items={plat,pie,jug};
  return ta;
}
function makeBunting(){
  const g=el('g',{filter:'url(#shs)'},L.back);
  const x0=610,y0=240,x1=1262,y1=205,sag=64;
  const pt=t=>({x:x0+(x1-x0)*t,y:y0+(y1-y0)*t+sag*4*t*(1-t)});
  let d='M'+x0+' '+y0;for(let i=1;i<=24;i++){const p=pt(i/24);d+=' L'+p.x.toFixed(1)+' '+p.y.toFixed(1);}
  el('path',{d,stroke:'#7a5a3a','stroke-width':3,fill:'none'},g);
  const cols=['#ff5a5f','#ffd23f','#3ec6a8','#5aa9ff','#ff8fc2'];
  for(let i=0;i<14;i++){const p=pt((i+.5)/14),q=pt((i+1)/14);P(g,[[p.x-14,p.y],[p.x+14,p.y+3],[p.x,p.y+40]],cols[i%5],{j:1,sw:2});}
  return actor(g,{y:-400});
}

/* ------------------------------------------------------------------
   The story
------------------------------------------------------------------ */
async function title(){
  const g=el('g',{filter:'url(#sh)'},L.ui);
  P(g,rectPts(-380,-120,760,240,4),'#fff3c4',{j:3,sw:5});
  el('rect',{x:-358,y:-98,width:716,height:196,fill:'none',stroke:'#e4572e','stroke-width':3,'stroke-dasharray':'12 9'},g);
  const t1=el('text',{'text-anchor':'middle',y:-6,'font-size':84,fill:'#d6342b',class:'tx'},g);t1.textContent='The Big Apple';
  const t2=el('text',{'text-anchor':'middle',y:76,'font-size':70,fill:'#2f8f4a',class:'tx'},g);t2.textContent='on the Tree';
  const a1=mkApple(g,30);a1.setAttribute('transform','translate(-335 -70) rotate(-15)');
  const a2=mkApple(g,30);a2.setAttribute('transform','translate(335 70) rotate(15)');
  const b=actor(g,{x:640,y:-300,rot:-2});
  await to(b,{y:260},1000,'bounce');
  await sleep(3000);
  await to(b,{y:-340,rot:3},700,'in');
  g.remove();
}

async function run(){
  btn.classList.remove('on');
  build();fit();
  capwrap.classList.remove('on');cap.textContent='';
  await sleep(700);
  await title();

  /* 1 — planting */
  say('One day, a man planted an apple tree.');
  await walkTo(man,455,600,3400);
  await to(man,{al:42,ar:42,rot:-10},500);
  to(mound,{s:1},400,'back');
  await sleep(500);
  to(treeA,{s:.07},600,'back');
  burst('',390,540,{r:46,c:'#fff3a0'});
  await sleep(700);
  await to(man,{al:8,ar:-8,rot:0},400);
  await sleep(500);

  /* 2 — watering for a month (time-lapse) */
  say('He watered it every day for one month.');
  await walkTo(man,550,600,1500);
  can.p.x=448;can.p.y=468;can.p.o=0;can.apply();
  await Promise.all([to(man,{al:95,ar:95},400),to(can,{o:1},300)]);
  await to(can,{rot:-25},400);
  pouring=true;
  to(tagA,{y:90},600,'back');
  await sleep(500);
  let said=false;
  const th0=.8,thT=PI*2*3+.5;
  await anim(9500,t=>{
    const th=th0+t*thT;
    setOrb(th);setNight(clamp(-Math.sin(th)*1.8,0,1));
    calText.textContent=String(1+Math.floor(t*29.99));
    treeA.p.s=.07+.93*EASE.io(t);treeA.apply();
    if(t>.8&&!said){said=true;say('A month later, it grew into a big tree with many apples, except one apple was bigger than the others.');}
  },'lin');
  setNight(0);setOrb(1.3);
  pouring=false;
  await to(can,{rot:0},300);
  await Promise.all([to(can,{o:0},300),to(man,{al:8,ar:-8},300),to(tagA,{y:-200},500,'in')]);
  for(let i=0;i<apples.length;i++){to(apples[i],{s:1},350,'back');await sleep(90);}
  await sleep(300);
  burst('',560,440,{r:95,c:'#ffe27a',hold:1100});
  await to(big,{s:1},800,'back');
  await sleep(2600);

  /* 3 — harvest */
  say('At harvest time, the man picked all the apples, except the big apple.');
  await walkTo(man,680,600,1700);
  harvestOn=true;
  const flights=[];
  for(let i=0;i<apples.length;i++){
    const a=apples[i],tx=600+pile[i][0],ty=600+pile[i][1],x0=a.p.x,y0=a.p.y,idx=i;
    flights.push(anim(750,(t,r)=>{a.p.x=x0+(tx-x0)*t;a.p.y=y0+(ty-y0)*t-Math.sin(r*PI)*90;a.p.rot=r*360;a.apply();},'lin').then(()=>{a.p.o=0;a.apply();pileA[idx].p.o=1;pileA[idx].apply();}));
    await sleep(330);
  }
  await Promise.all(flights);
  harvestOn=false;
  await to(man,{al:8,ar:-8},300);
  await sleep(500);

  /* 4 — man tries alone, calls the woman */
  say("He couldn't pull out the big apple, so he called the woman to help him.");
  setMembers([man]);man.p.mood=1;man.apply();
  await to(pull,{lean:7,amp:5,rate:7},500);
  burst('Heave!',560,330,{r:62,fs:30});
  await sleep(2000);
  bubble('Help!',man.p.x,man.p.y-235,1800);
  await sleep(900);
  await walkTo(woman,770,600,2600);
  setMembers([man,woman]);
  await to(pull,{lean:9,amp:6},500);

  /* 5 — they pull and pull */
  say('They pulled and pulled, but it still wouldn\u2019t budge.');
  burst('Heave!',700,340,{r:62,fs:30,rot:6});
  await sleep(4200);

  /* 6 — son */
  say('So the woman called her son to help out. When he came, they tried again, but they still couldn\u2019t pull it out.');
  bubble('Come help!',woman.p.x,woman.p.y-225,1800,28);
  await sleep(800);
  await walkTo(son,855,600,2000);
  setMembers([man,woman,son],[1,1,.9]);
  await to(pull,{lean:10,amp:6},500);
  burst('Heave!',620,330,{r:62,fs:30});
  await sleep(4000);

  /* 7 — son fetches his sister */
  say('In a flash, the son went to get his sister.');
  await to(pull,{lean:0,amp:0},450);
  setMembers([man,woman]);
  son.p.rot=0;son.p.bob=0;son.apply();
  await walkTo(son,1450,600,900,'in',70);
  await sleep(1300);
  say('When the daughter came, they wasted no time and started pulling, but it wasn\u2019t enough.');
  son.p.x=1500;son.apply();
  await Promise.all([
    walkTo(son,855,600,1500,'out',85),
    sleep(250).then(()=>walkTo(daughter,934,600,1500,'out',85))
  ]);
  setMembers([man,woman,son,daughter],[1,1,.9,.9]);
  await to(pull,{lean:11,amp:7},500);
  burst('Heave!',720,320,{r:62,fs:30,rot:6});
  await sleep(4200);

  /* 8 — dog */
  say('Just then, the dog was walking by and wanted to help.');
  dog.p.x=1450;dog.p.y=640;dog.apply();
  L.front.appendChild(dog.g);
  await walkTo(dog,1060,640,3000,'io',200);
  await sleep(300);
  L.chars.appendChild(dog.g);
  await walkTo(dog,1050,600,700);
  pull.dogOn=true;
  say('So the dog, the daughter, the son, the woman and the man all pulled\u2026 and it finally budged, but only a little!');
  await to(pull,{lean:12,amp:9,rate:8},700);
  await sleep(1500);
  await to(pull,{amp:22},600);
  burst('!',590,350,{r:46,fs:44,rot:10});
  await sleep(1800);
  await to(pull,{lean:0,amp:0,off:8},600);
  await sleep(1400);

  /* 9 — the idea */
  say('But the daughter noticed the cat and her kittens, and she got an idea!');
  to(daughter,{hd:14},300);
  await sleep(600);
  bulb(daughter.p.x,daughter.p.y-250);
  burst('Ting!',daughter.p.x-90,daughter.p.y-290,{r:44,fs:24,c:'#ffffff',tc:'#e08a00',rot:-12});
  await sleep(2600);
  say('Her idea was that if she put cat treats around the stem, it would finally work.');
  bubble('Here, kitties!',daughter.p.x,daughter.p.y-215,2000,26);
  await sleep(900);

  // cats scamper over
  const dest=[[520,628],[548,628],[590,628],[650,628]];
  const runs=cats.map((c,i)=>{c.p.fl=-1;c.apply();return sleep(i*180).then(()=>hopTo(c,dest[i][0],2300,9,dest[i][1]));});
  // daughter throws fish treats
  await sleep(1200);
  daughter.ov={on:true,ar:-8};
  await to(daughter.ov,{ar:150},350);
  const tOff=[[-30,-36],[-12,-40],[10,-40],[30,-34],[-48,-10],[48,-10]];
  const tflights=[];
  for(let i=0;i<tOff.length;i++){
    const g=el('g',{},L.fx);
    P(g,ellPts(0,0,9,5,8),'#e0a05a',{j:.4,sw:1});P(g,[[8,0],[15,-5],[15,5]],'#e0a05a',{j:.3,sw:1});
    el('circle',{cx:-4,cy:-1,r:1.2,fill:'#4a2f1b'},g);
    const tr=actor(g,{x:daughter.p.x-40,y:daughter.p.y-190,s:1.2});
    tr.ox=tOff[i][0];tr.oy=tOff[i][1]+(i>3?0:0);
    treats.push(tr);
    const x0=tr.p.x,y0=tr.p.y;
    const tx=i>3?(i===4?520:600)+0:560+tr.ox,ty=i>3?640:440+tr.oy;
    tflights.push(anim(800,(t,r)=>{tr.p.x=x0+(tx-x0)*t;tr.p.y=y0+(ty-y0)*t-Math.sin(r*PI)*130;tr.p.rot=r*540;tr.apply();},'lin').then(()=>{if(i<=3)tr.att=true;}));
    await sleep(170);
  }
  await Promise.all(tflights.concat(runs));
  await to(daughter.ov,{ar:-8},350);daughter.ov.on=false;

  /* 10 — kittens chew the stem */
  say('So that\u2019s what they did! The kittens hopped up and chewed the stem of the apple.');
  mother.p.fl=1;mother.apply();
  await sleep(500);
  const bx=big.p.x,by=big.p.y;
  await Promise.all([
    jump(kits[0],bx-14,by-34,800,110).then(()=>{kits[0].perch=true;kits[0].p.hd=14;}),
    sleep(350).then(()=>jump(kits[1],bx+22,by-32,800,110)).then(()=>{kits[1].perch=true;kits[1].p.hd=-14;})
  ]);
  chewOn=true;eatOn=true;
  const chewMs=3200;
  anim(chewMs,(t)=>{stemW=9-6.6*t;},'lin');
  const crumbT=setInterval(()=>crumb(566,378),110);
  await sleep(chewMs);
  clearInterval(crumbT);
  chewOn=false;eatOn=false;
  cats.forEach(c=>{c.p.bob=0;c.apply();});

  /* 11 — final pull */
  say('They got ready to pull, and it was working! It was getting easier to pull.');
  await sleep(600);
  await to(pull,{lean:13,amp:14,rate:9},900);
  burst('Creeak\u2026',590,330,{r:66,fs:28,rot:-6});
  await to(pull,{lean:15,amp:30},3000,'in');
  await waitFor(()=>Math.sin(pull.ph)>.97);

  /* 12 — POP! */
  say('Then, finally, they pulled it out!');
  pull.free=true;pull.snapped=true;pull.dogOn=false;
  const members=pull.members.slice();
  kits.forEach(k=>{k.perch=false;});
  treats.forEach(t=>{t.att=false;to(t,{o:0},300);});
  burst('POP!',620,300,{r:90,fs:52,rot:-10,hold:1200});
  jump(kits[0],600,628,600,70);jump(kits[1],650,628,700,70);
  members.concat([dog]).forEach((m,i)=>{
    if(m!==dog){m.p.mood=1;to(m,{al:170,ar:-170},250);}
    to(m,{rot:78+i*3,y:m.p.y},450,'out').then(()=>puff(m.p.x+110+i*10,600,2));
  });
  // apple recoils to the left and lands
  const ax0=big.p.x,ay0=big.p.y;
  anim(900,(t,r)=>{big.p.x=ax0+(500-ax0)*r;big.p.y=ay0+(550-ay0)*t;big.p.rot=-r*400;big.apply();},'lin');
  await sleep(950);
  anim(500,(t,r)=>{big.p.y=550-40*Math.sin(r*PI);big.p.x=500-30*r;big.p.rot=-400-r*180;big.apply();},'lin');
  await sleep(1700);
  members.forEach(m=>{m.p.mood=0;});
  await Promise.all(members.map((m,i)=>sleep(i*90).then(()=>to(m,{rot:0,al:8,ar:-8},420,'back'))));
  dog.p.rot=0;await to(dog,{rot:0,hd:0},200);
  setMembers([]);
  cheerOn=true;
  puff(500,590,4);
  await sleep(1300);

  /* 13 — dinner */
  say('And they had a very, very big dinner!');
  tableA=makeTable();
  buntA=makeBunting();
  await to(tableA,{y:0},900,'bounce');
  puff(850,640,5);puff(600,640,2);puff(1120,640,2);
  to(buntA,{y:0},900,'bounce');
  // everyone takes a seat behind the table
  cheerOn=false;
  await Promise.all([
    walkTo(man,650,600,1100),walkTo(woman,730,600,1100),walkTo(son,1000,600,1500),walkTo(daughter,1075,600,1700)
  ]);
  cheerOn=false;
  [man,woman,son,daughter].forEach(m=>{m.p.bob=0;m.p.al=8;m.p.ar=-8;m.p.rot=0;m.apply();});
  walkTo(dog,1235,640,1500);
  // cats settle by the table
  hopTo(mother,470,1000,3,628);hopTo(kits[0],515,1000,3,630);hopTo(kits[1],430,1000,3,632);hopTo(kits[2],545,1000,3,634);
  await sleep(1400);
  // apple hops onto the table
  L.front.appendChild(big.g.parentNode===null?big.g:big.g);
  const bx0=big.p.x,by0=big.p.y;
  await anim(900,(t,r)=>{big.p.x=bx0+(845-bx0)*r;big.p.y=by0+(498-by0)*r-Math.sin(r*PI)*220;big.p.rot+=6;big.apply();},'lin');
  puff(845,545,4);
  await sleep(300);
  burst('Poof!',845,430,{r:72,fs:34,c:'#fff3a0',rot:6});
  await to(big,{s:0,o:0},250,'in');
  tableA.fed=true;
  confetti=true;
  const it=tableA.items;
  to(it.plat,{s:1},450,'back');
  await sleep(250);
  to(it.pie,{s:1},450,'back');
  await sleep(250);
  to(it.jug,{s:1},450,'back');
  // happy hands
  cheerOn=true;cheerList=[man,woman,son,daughter];
  await sleep(6500);

  /* the end */
  say('The End');
  cheerOn=false;
  [man,woman,son,daughter].forEach(m=>{m.p.al=8;m.p.ar=-8;m.p.bob=0;m.apply();});
  await sleep(2500);
  confetti=false;
  btn.classList.add('on');
}

/* ------------------------------------------------------------------
   Boot
------------------------------------------------------------------ */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  for(let i=0;i<T.length;i++)T[i](dt,now/1000);
  requestAnimationFrame(loop);
}
window.addEventListener('resize',fit);
btn.addEventListener('click',()=>{
  btn.classList.remove('on');capwrap.classList.remove('on');
  setTimeout(()=>run().catch(console.error),500);
});
makeGrain();torn();fit();
requestAnimationFrame(loop);
run().catch(console.error);
})();
</script>
