<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Memory Verse Under the Ha’amonga</title>
<style>
  html,body{margin:0;height:100%;background:#2a1a10;overflow:hidden}
  svg#stage{position:fixed;inset:0;width:100%;height:100%;display:block}
  .cut{stroke:#fff7e0;stroke-width:1.4;paint-order:stroke fill;stroke-linejoin:round}
  .btxt,.ctxt,.ttxt{font-family:"Chalkboard SE","Comic Sans MS","Comic Neue","Segoe Print","Marker Felt","Trebuchet MS",sans-serif}
  .btxt{font-weight:800;fill:#3a2418}
  .ctxt{fill:#3a2418}
  .ttxt{font-weight:800;fill:#3a2418}
  #replay{
    position:fixed;left:50%;top:46%;
    transform:translate(-50%,-50%) scale(.5) rotate(-3deg);
    opacity:0;pointer-events:none;cursor:pointer;
    display:flex;align-items:center;gap:14px;
    padding:18px 34px;border-radius:18px;
    background:#fff3d6;color:#3a2418;
    border:5px dashed #c8102e;
    font:800 clamp(22px,3.6vw,38px) "Chalkboard SE","Comic Sans MS","Comic Neue","Segoe Print","Trebuchet MS",sans-serif;
    box-shadow:4px 7px 0 rgba(42,22,10,.45), 0 0 0 6px #fff3d6;
    transition:opacity .7s ease, transform .7s cubic-bezier(.3,1.7,.5,1);
  }
  #replay.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1) rotate(-3deg)}
  #replay:hover{transform:translate(-50%,-50%) scale(1.07) rotate(2deg)}
  #replay:focus-visible{outline:4px solid #ffb12b;outline-offset:4px}
  #replay svg{width:1.1em;height:1.1em}
</style>
</head>
<body>

<svg id="stage" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- rough hand-cut edge + paper shadow -->
    <filter id="rough" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feDropShadow in="d" dx="2.2" dy="3" stdDeviation="1.6" flood-color="#2a160a" flood-opacity=".42"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="135%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#2a160a" flood-opacity=".4"/>
    </filter>
    <!-- ngatu (Tongan tapa cloth) pattern -->
    <pattern id="ngatu" width="96" height="48" patternUnits="userSpaceOnUse">
      <rect width="96" height="48" fill="#7b3b1f"/>
      <rect y="0" width="96" height="3" fill="#e9cf9b"/>
      <rect y="45" width="96" height="3" fill="#e9cf9b"/>
      <path d="M24,7 L38,24 L24,41 L10,24Z" fill="#e9cf9b"/>
      <path d="M24,15 L31,24 L24,33 L17,24Z" fill="#241309"/>
      <path d="M58,41 L72,8 L86,41Z" fill="#241309"/>
      <path d="M65,36 L72,19 L79,36Z" fill="#e9cf9b"/>
      <circle cx="48" cy="12" r="3" fill="#e9cf9b"/>
      <circle cx="48" cy="36" r="3" fill="#e9cf9b"/>
      <circle cx="3" cy="24" r="2.2" fill="#e9cf9b"/>
      <circle cx="93" cy="24" r="2.2" fill="#e9cf9b"/>
    </pattern>
    <!-- woven ta'ovala mat -->
    <pattern id="matp" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0,0L6,6M6,0L0,6" stroke="#9a7434" stroke-width=".9" opacity=".8"/>
    </pattern>
  </defs>
</svg>

<button id="replay" type="button" aria-label="Replay the story">
  <svg viewBox="0 0 24 24" fill="none" stroke="#c8102e" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 3.5V8h-4.5"/></svg>
  Replay
</button>

<script>
(() => {
"use strict";

/* =====================================================================
   EASY EDIT: put the memory verse here (and optionally its reference).
   ===================================================================== */
const MEMORY_VERSE     = "Be kind to one another, tender-hearted, forgiving each other, just as God also in Christ forgave you.";
const MEMORY_VERSE_REF = "Ephesians 4:32";            // e.g. "Psalm 119:11"  (leave empty for none)

/* ===================================================================== */
const W = 1280, H = 720, FPS = 15;               // 15 fps = stop-motion feel
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("stage");
const btn = document.getElementById("replay");
const RED = "#c8102e", CREAM = "#fff3d6", INK = "#3a2418";

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp  = (a, b, t) => a + (b - a) * t;
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) if (attrs[k] !== undefined) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const g = (parent, attrs) => el("g", attrs, parent);
const cut = (parent, tag, attrs) => el(tag, Object.assign({ class: "cut" }, attrs), parent);

/* ---------- easing ---------- */
const E = {
  lin: p => p,
  io:  p => p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2) / 2,
  out: p => 1 - Math.pow(1 - p, 3),
  back: p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(p-1, 3) + c1*Math.pow(p-1, 2); },
  bounce: p => { const n = 7.5625, d = 2.75;
    if (p < 1/d) return n*p*p;
    if (p < 2/d) return n*(p -= 1.5/d)*p + .75;
    if (p < 2.5/d) return n*(p -= 2.25/d)*p + .9375;
    return n*(p -= 2.625/d)*p + .984375; }
};

/* ---------- tiny animation engine (all timing runs off one clock) ---------- */
let jobs = [], lastRender = 0, T = 0;
const actors = [], bubbles = [], amb = [], L = {};
function anim(ms, fn, ease = E.io) {
  return new Promise(res => jobs.push({ t0: null, ms, fn, ease, res }));
}
const wait = ms => anim(ms, () => {}, E.lin);
const par = (...p) => Promise.all(p);

function loop(ts) {
  T = ts / 1000;
  const cur = jobs; jobs = [];
  for (const j of cur) {
    if (j.t0 === null) j.t0 = ts;
    let p = j.ms <= 0 ? 1 : (ts - j.t0) / j.ms;
    const done = p >= 1; if (done) p = 1;
    j.fn(j.ease(p), p);
    if (done) j.res(); else jobs.push(j);
  }
  if (ts - lastRender >= 1000 / FPS - 2) { lastRender = ts; renderAll(); }
  requestAnimationFrame(loop);
}

function renderAll() {
  for (const f of amb) f(T);
  for (const a of actors) a.render();
  for (const layer of [L.crowd, L.front]) {
    if (!layer) continue;
    const arr = actors.filter(a => a.layer === layer).sort((a, b) => (a.y - b.y) || (a.x - b.x));
    if (arr.some((a, i) => layer.children[i] !== a.node)) arr.forEach(a => layer.appendChild(a.node));
  }
  for (const b of bubbles) {
    const a = b.a;
    const x = clamp(a.x, b.w/2 + 12, W - 12 - b.w/2);
    const y = clamp(a.top() - 8 - (b.lift || 0), b.h + 24, 598);
    b.grp.setAttribute("transform", `translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${Math.max(0.001, b.s).toFixed(3)})`);
  }
}

/* =====================================================================
   ACTORS
   ===================================================================== */
class Actor {
  constructor(node, o = {}) {
    this.node = node; this.sc = o.sc || 1; this.h = o.h || 50;
    this.hopH = o.hopH ?? 6; this.stepLen = o.stepLen || 26;
    this.x = -400; this.y = 588; this.rot = 0; this.flip = 1; this.op = 1;
    this.hop = 0; this.ty = 0; this.crouch = 0; this.wob = 0;
    this.layer = null; this.sound = o.sound || ""; this.nm = o.nm || "";
    actors.push(this);
  }
  put(layer) { this.layer = layer; layer.appendChild(this.node); return this; }
  top() { return this.y + this.hop + this.ty - this.h * this.sc * (1 - 0.26 * this.crouch); }
  render() {
    const jr = (Math.random() - .5) * 1.4, jx = (Math.random() - .5) * 1.2, jy = (Math.random() - .5);
    const c = this.crouch;
    const sy = this.sc * (1 - 0.26 * c), sx = this.sc * (1 + 0.07 * c);
    this.node.setAttribute("transform",
      `translate(${(this.x + jx).toFixed(1)},${(this.y + this.hop + this.ty + jy).toFixed(1)}) ` +
      `rotate(${(this.rot + this.wob + jr).toFixed(1)}) scale(${(sx * this.flip).toFixed(3)},${sy.toFixed(3)})`);
    this.node.setAttribute("opacity", this.op.toFixed(2));
  }
}

class Person extends Actor {
  constructor(o) {
    const P = buildPerson(o);
    super(P.root, { sc: o.sc, h: 75 + 2 * (o.headR || 12), hopH: 5, stepLen: 34, nm: o.nm });
    this.P = P; this.isPerson = true;
    this.bend = o.bend0 || 0; this.aR = -5; this.aL = 5; this.lR = 1; this.lL = 1;
    this.smile = 0; this.cam = 0; this.rest = { bend: this.bend, aR: -5, aL: 5, lR: 1, lL: 1 };
  }
  render() {
    super.render();
    const P = this.P;
    P.upper.setAttribute("transform", `rotate(${this.bend.toFixed(1)},0,-50)`);
    P.armR.setAttribute("transform", `translate(14,-72) rotate(${this.aR.toFixed(1)}) scale(1,${this.lR.toFixed(2)})`);
    P.armL.setAttribute("transform", `translate(-14,-72) rotate(${this.aL.toFixed(1)}) scale(1,${this.lL.toFixed(2)})`);
    P.m1.setAttribute("display", this.smile > .5 ? "none" : "inline");
    P.m2.setAttribute("display", this.smile > .5 ? "inline" : "none");
    P.cam.setAttribute("display", this.cam ? "inline" : "none");
    const bl = Math.random() < 0.025;
    P.eyes.setAttribute("transform", bl ? `translate(0,${P.cy}) scale(1,.15) translate(0,${-P.cy})` : "");
  }
}

/* ---------- people (drawn at 100 units tall, feet at 0,0, facing front) ---------- */
function buildPerson(o) {
  const R = o.headR || 12, cy = -75 - R;
  const root = el("g", { filter: "url(#rough)" });
  // legs & feet
  cut(root, "rect", { x: -10, y: -32, width: 8, height: 32, rx: 3.5, fill: o.skin });
  cut(root, "rect", { x: 2,   y: -32, width: 8, height: 32, rx: 3.5, fill: o.skin });
  cut(root, "ellipse", { cx: -7, cy: -1.5, rx: 7, ry: 3, fill: o.skinD });
  cut(root, "ellipse", { cx:  7, cy: -1.5, rx: 7, ry: 3, fill: o.skinD });
  // tupenu (wrap skirt) with ngatu-style hem
  cut(root, "path", { d: "M-17,-50 L17,-50 L20,-22 L-20,-22 Z", fill: o.skirt });
  cut(root, "rect", { x: -20, y: -27, width: 40, height: 5, fill: o.hem });
  for (let i = 0; i < 7; i++) el("path", { d: `M${-19 + i*6},-22 l3,-5 l3,5 Z`, fill: "#fff3d6" }, root);

  const upper = g(root);
  const armL = g(upper), armR = g(upper);      // re-ordered below so arms sit on top
  // torso
  cut(upper, "rect", { x: -13, y: -76, width: 26, height: 27, rx: 6, fill: o.top });
  el("path", { d: "M-7,-76 L0,-66 L7,-76 Z", fill: o.skin }, upper);
  el("path", { d: "M-7,-76 L0,-66 L7,-76", fill: "none", stroke: o.topAccent, "stroke-width": 2, "stroke-linejoin": "round" }, upper);
  // ta'ovala (woven mat) tied with a rope
  cut(upper, "rect", { x: -16, y: -54, width: 32, height: 17, rx: 2, fill: o.mat });
  el("rect", { x: -16, y: -54, width: 32, height: 17, rx: 2, fill: "url(#matp)" }, upper);
  el("path", { d: "M-16,-52 Q0,-47 16,-52", stroke: "#6b4423", "stroke-width": 2.4, fill: "none" }, upper);
  el("circle", { cx: 0, cy: -49.5, r: 2.4, fill: "#6b4423" }, upper);
  // arms (on top of torso & mat)
  for (const [grp, tone] of [[armL, 0], [armR, 1]]) {
    upper.appendChild(grp);
    cut(grp, "rect", { x: -3.6, y: 0, width: 7.2, height: 14, rx: 3, fill: o.top });
    cut(grp, "rect", { x: -3.2, y: 11, width: 6.4, height: 15, rx: 3, fill: o.skin });
    cut(grp, "circle", { cx: 0, cy: 27, r: 3.8, fill: o.skin });
  }
  // neck, ears, head
  cut(upper, "rect", { x: -3.6, y: -81, width: 7.2, height: 9, fill: o.skinD });
  cut(upper, "circle", { cx: -R, cy: cy + 1, r: 3, fill: o.skinD });
  cut(upper, "circle", { cx:  R, cy: cy + 1, r: 3, fill: o.skinD });
  cut(upper, "circle", { cx: 0, cy, r: R, fill: o.skin });
  // hair
  const hr = R + 1;
  cut(upper, "path", {
    d: `M${-hr},${cy - 1} A${hr},${hr} 0 0 1 ${hr},${cy - 1} Q${R*.5},${cy - R*.5} 0,${cy - R*.55} Q${-R*.5},${cy - R*.5} ${-hr},${cy - 1} Z`,
    fill: o.hair });
  if (o.hairStyle === "bun") cut(upper, "circle", { cx: 0, cy: cy - R - 3, r: R * .42, fill: o.hair });
  // face
  const eyes = g(upper);
  el("ellipse", { cx: -R*.38, cy: cy + 1.5, rx: 1.7, ry: 2.1, fill: "#2a1a12" }, eyes);
  el("ellipse", { cx:  R*.38, cy: cy + 1.5, rx: 1.7, ry: 2.1, fill: "#2a1a12" }, eyes);
  el("circle", { cx: -R*.62, cy: cy + 6, r: 2.7, fill: "#d9603f", opacity: .45 }, upper);
  el("circle", { cx:  R*.62, cy: cy + 6, r: 2.7, fill: "#d9603f", opacity: .45 }, upper);
  const m1 = el("path", { d: `M-3.6,${cy + 6.5} Q0,${cy + 9.5} 3.6,${cy + 6.5}`, stroke: "#4a1d12", "stroke-width": 1.5, fill: "none", "stroke-linecap": "round" }, upper);
  const m2 = el("path", { d: `M-5.4,${cy + 5.5} Q0,${cy + 14.5} 5.4,${cy + 5.5} Z`, fill: "#8a1f1f", display: "none" }, upper);
  if (o.glasses) {
    el("circle", { cx: -R*.38, cy: cy + 1.5, r: 4.4, fill: "none", stroke: "#3a2418", "stroke-width": 1.2 }, upper);
    el("circle", { cx:  R*.38, cy: cy + 1.5, r: 4.4, fill: "none", stroke: "#3a2418", "stroke-width": 1.2 }, upper);
    el("path", { d: `M${-R*.38 + 4.4},${cy + 1.5} L${R*.38 - 4.4},${cy + 1.5}`, stroke: "#3a2418", "stroke-width": 1.1 }, upper);
  }
  // frangipani flower in the hair
  if (o.flower) {
    const f = g(upper, { transform: `translate(${-R*.72},${cy - R*.42})` });
    for (let i = 0; i < 5; i++) cut(f, "ellipse", { cx: 0, cy: -4, rx: 2.8, ry: 4.4, fill: "#fffaf0", transform: `rotate(${i*72})` });
    el("circle", { r: 1.9, fill: "#ffcf40" }, f);
  }
  // camera (shown only when raised)
  const cam = g(upper, { display: "none" });
  cut(cam, "rect", { x: -13, y: cy - 8, width: 26, height: 17, rx: 3, fill: "#2b2b33" });
  cut(cam, "rect", { x: -9, y: cy - 12, width: 10, height: 5, rx: 1.5, fill: "#3a3a45" });
  el("circle", { cx: 0, cy: cy + .5, r: 6, fill: "#7b8aa6" }, cam);
  el("circle", { cx: 0, cy: cy + .5, r: 3.6, fill: "#1c1c24" }, cam);
  el("circle", { cx: -1.4, cy: cy - 1, r: 1.1, fill: "#fff" }, cam);
  el("rect", { x: 6, y: cy - 6, width: 5, height: 3, fill: "#f2f2f2" }, cam);
  cut(cam, "circle", { cx: -16, cy: cy + 1, r: 3.8, fill: o.skin });
  cut(cam, "circle", { cx:  16, cy: cy + 1, r: 3.8, fill: o.skin });

  return { root, upper, armL, armR, m1, m2, cam, eyes, cy };
}

/* ---------- animals (side view, facing right, feet at 0,0) ---------- */
function buildChicken() {
  const r = el("g", { filter: "url(#rough)" });
  el("path", { d: "M-4,-11 L-4,0 M-6,0 L-1,0 M5,-11 L5,0 M3,0 L8,0", stroke: "#e59a2b", "stroke-width": 2.4, fill: "none", "stroke-linecap": "round" }, r);
  cut(r, "path", { d: "M-12,-22 Q-34,-44 -28,-52 Q-18,-38 -10,-27 Z", fill: "#2e5d4b" });
  cut(r, "path", { d: "M-12,-20 Q-38,-34 -36,-42 Q-22,-32 -10,-24 Z", fill: "#8a3a1c" });
  cut(r, "path", { d: "M-12,-24 Q-26,-52 -20,-58 Q-14,-44 -9,-28 Z", fill: RED });
  cut(r, "ellipse", { cx: 0, cy: -22, rx: 16, ry: 12, fill: "#c9622f" });
  cut(r, "ellipse", { cx: -3, cy: -22, rx: 9, ry: 6.5, fill: "#8f3d1a", transform: "rotate(-15 -3 -22)" });
  cut(r, "circle", { cx: 13, cy: -36, r: 7.5, fill: "#c9622f" });
  for (const x of [10, 13.5, 17]) cut(r, "circle", { cx: x, cy: x === 13.5 ? -45.5 : -44, r: 2.9, fill: "#d8202d" });
  cut(r, "path", { d: "M19.5,-37.5 L27,-35 L19.5,-32.5 Z", fill: "#f2b21e" });
  cut(r, "ellipse", { cx: 19, cy: -30.5, rx: 2, ry: 3.2, fill: "#d8202d" });
  el("circle", { cx: 15.5, cy: -37.5, r: 1.4, fill: "#1a1210" }, r);
  return r;
}
function buildCat() {
  const r = el("g", { filter: "url(#rough)" });
  el("path", { d: "M-16,-15 Q-33,-18 -31,-36 Q-30,-42 -24,-40", stroke: "#e08a35", "stroke-width": 5.5, fill: "none", "stroke-linecap": "round" }, r);
  for (const x of [-13, -6, 7, 13]) cut(r, "rect", { x: x - 2.6, y: -10, width: 5.2, height: 10, rx: 2.4, fill: "#d27a2b" });
  cut(r, "ellipse", { cx: 0, cy: -15, rx: 18, ry: 10, fill: "#e08a35" });
  for (const x of [-8, -1, 6]) el("path", { d: `M${x},-24 q1,4 -1,8`, stroke: "#a85a1a", "stroke-width": 2.2, fill: "none", "stroke-linecap": "round" }, r);
  cut(r, "path", { d: "M10,-33 L11,-45 L18.5,-36 Z", fill: "#e08a35" });
  cut(r, "path", { d: "M17,-36 L24,-45 L26.5,-32 Z", fill: "#e08a35" });
  el("path", { d: "M12,-36 L12.5,-41 L16,-37 Z", fill: "#f2a6b0" }, r);
  cut(r, "circle", { cx: 18, cy: -27, r: 10, fill: "#e08a35" });
  el("ellipse", { cx: 22, cy: -23, rx: 5.2, ry: 3.4, fill: "#fff0d8" }, r);
  el("circle", { cx: 14.5, cy: -28.5, r: 2.1, fill: "#7cc24a" }, r);
  el("circle", { cx: 22, cy: -28.5, r: 2.1, fill: "#7cc24a" }, r);
  el("ellipse", { cx: 14.8, cy: -28.5, rx: .7, ry: 1.7, fill: "#1a1210" }, r);
  el("ellipse", { cx: 22.3, cy: -28.5, rx: .7, ry: 1.7, fill: "#1a1210" }, r);
  el("path", { d: "M25.6,-25.4 L28.2,-25.4 L26.9,-23.8 Z", fill: "#e07a90" }, r);
  el("path", { d: "M27,-24 L34,-26 M27,-23 L34,-22 M17,-24 L11,-26 M17,-23 L11,-21", stroke: "#fff7e0", "stroke-width": .9, fill: "none" }, r);
  return r;
}
function buildDog() {
  const r = el("g", { filter: "url(#rough)" });
  el("path", { d: "M-22,-27 Q-35,-33 -30,-46", stroke: "#a56a3a", "stroke-width": 5.5, fill: "none", "stroke-linecap": "round" }, r);
  for (const x of [-19, -11, 11, 18]) cut(r, "rect", { x: x - 3, y: -14, width: 6, height: 14, rx: 2.5, fill: "#a56a3a" });
  cut(r, "ellipse", { cx: 0, cy: -22, rx: 24, ry: 12, fill: "#b87a45" });
  el("ellipse", { cx: -6, cy: -26, rx: 8, ry: 5.5, fill: "#e9d3b0" }, r);
  cut(r, "circle", { cx: 24, cy: -34, r: 11, fill: "#b87a45" });
  cut(r, "rect", { x: 28, y: -35, width: 13, height: 9, rx: 4, fill: "#d9a56f" });
  el("circle", { cx: 41, cy: -33.5, r: 3, fill: "#1a1210" }, r);
  el("ellipse", { cx: 36, cy: -24, rx: 2.4, ry: 4, fill: "#e8647c" }, r);
  cut(r, "path", { d: "M18,-43 Q9,-32 15,-22 Q23,-27 23,-41 Z", fill: "#6d4122" });
  el("circle", { cx: 27, cy: -37, r: 1.7, fill: "#1a1210" }, r);
  return r;
}
function buildLizard() {
  const r = el("g", { filter: "url(#rough)" });
  el("path", { d: "M-13,-7 Q-28,-1 -38,-12 Q-42,-17 -37,-20", stroke: "#7fb83a", "stroke-width": 4.6, fill: "none", "stroke-linecap": "round" }, r);
  el("path", { d: "M10,-5 L17,0 M5,-4 L4,0 M-6,-4 L-8,0 M-11,-5 L-16,0", stroke: "#6ca12e", "stroke-width": 2.8, fill: "none", "stroke-linecap": "round" }, r);
  cut(r, "ellipse", { cx: 0, cy: -7, rx: 15, ry: 5.2, fill: "#7fb83a" });
  for (const x of [-6, 0, 6]) el("circle", { cx: x, cy: -8, r: 1.6, fill: "#4f8a22" }, r);

function crowdLayout(lineup, spread) {
  const n = lineup.length;
  return lineup.map((a, i) => {
    let x;
    if (!spread) x = n === 1 ? 640 : 505 + 275 * i / (n - 1);
    else { const half = Math.ceil(n / 2); x = i < half ? 490 + 95 * i / Math.max(1, half - 1) : 700 + 95 * (i - half) / Math.max(1, n - half - 1); }
    return { a, x, y: i % 2 === 0 ? 588 : 575 };
  });
}
async function shuffle(lineup, ms = 800, spread = false, skip = null) {
  const lay = crowdLayout(lineup, spread);
  await Promise.all(lay.filter(o => o.a !== skip).map(o => walk(o.a, o.x, o.y, ms, { face: false, hopH: 4 })));
  lay.forEach(o => { o.a.flip = o.x < 640 ? 1 : -1; });
}
const crowdDown = a => to(a, { crouch: 1, bend: a.isPerson ? 34 : 0 }, 350, E.back);
const crowdUp   = a => to(a, { crouch: 0, bend: 0 }, 420, E.back);
const nameList = arr => arr.length === 1 ? arr[0] : arr.slice(0, -1).join(", ") + " and " + arr[arr.length - 1];

            say(kid, "Mālō!", 1800), hopInPlace(kid, 14, 2, 600));

  /* --- 12. mouse bows & leaves --- */
  await par(narrate("The mouse bowed down, said “Squeak!”, and ran away.", { ms: 4800 }),
            (async () => {
              await to(mouse, { rot: 38 }, 450);
              say(mouse, "Squeak!", 1100);
              await wait(900);
              await to(mouse, { rot: 0 }, 300);
              mouse.flip = -1;
              await walk(mouse, -120, 596, 1500, { hopH: 8 });
            })());

  /* --- 13. goodbye chat --- */
  kid.put(L.front);
  gma.smile = 0; gpa.smile = 0;
  await par(narrate("Adult: “Fefe hake?”", { ms: 2800 }),
            walk(adult, 870, 592, 3200),
            walk(kid, 790, 594, 2400, { hopH: 4 }),
            to(kid, { crouch: 0, bend: 0 }, 300),
            (async () => { await wait(2300); await say(adult, "Fefe hake?", 1500); })());
  adult.flip = 1;
  await par(narrate("Old couple: “Sai pe!”", { ms: 2400 }),
            say(gma, "Sai pe!", 1800), say(gpa, "Sai pe!", 1800, { lift: 4 }), talk(gma, 1500), talk(gpa, 1500));
  adult.flip = -1; kid.flip = 1;
  await par(narrate("Adult: “Mālō for taking a picture with me earlier.”", { ms: 4200 }),
            talk(adult, 3000), say(adult, "Mālō!", 2000));
  await par(narrate("Little kid: “You’re welcome!”", { ms: 2800 }),
            say(kid, "You’re welcome!", 2000), hopInPlace(kid, 12, 2, 600));
  adult.flip = 1;
  await par(narrate("Adult: “Okay, I’d better go. Bye!”", { ms: 3200 }),
            say(adult, "Bye!", 2200), waveLoop(adult, 2200));
  await par(narrate("Old couple: “Bye!”", { ms: 2400 }),
            say(gma, "Bye!", 1800), say(gpa, "Bye!", 1800, { lift: 4 }), waveLoop(gma, 1800), waveLoop(gpa, 1800));
  await par(narrate("Little kid: “Bye!”", { ms: 3600 }),
            say(kid, "Bye!", 1800), waveLoop(kid, 2000),
            (async () => { await wait(300); await walk(adult, -140, 592, 3300); })());
  await wait(400);

  /* --- 14. the end --- */
  setCaption("The End", { bold: true });
  await par(...crowd.map((a, i) => (async () => { await wait(i * 90); await hopInPlace(a, 12, 2, 600); })()),
            waveLoop(kid, 1800), waveLoop(gma, 1800), waveLoop(gpa, 1800));
  await wait(1400);
}

async function start() {
  btn.classList.remove("show");
  try { await story(); } catch (err) { console.error(err); }
  btn.classList.add("show");
}
btn.addEventListener("click", start);

requestAnimationFrame(loop);
start();
})();
</script>
